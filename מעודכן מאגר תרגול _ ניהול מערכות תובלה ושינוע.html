/* ===== t2: אמצעי תחבורה, אינטרמודליות ומרכיבי התנועה ===== */
{topic:"t2", q:"מה ההבדל המהותי בין \"Truckload (TL)\" ל\"Less than Truckload (LTL)\" בהובלת מטען?",
 options:["ב-TL משלוח בודד גדול תופס משאית שלמה, ואילו ב-LTL מספר משלוחים קטנים של לקוחות שונים משולבים באותה משאית","TL משמש רק להובלה ימית ו-LTL רק להובלה יבשתית","LTL הוא סוג של מכולה בלבד ואינו קשור למשאיות","TL תמיד זול יותר מ-LTL ללא קשר לנפח המטען"], correct:0,
 explain:"בהיררכיית הובלת המטען במשאית (Truck) מופיעה ההבחנה בין Truckload (TL) - משלוח בודד שממלא משאית שלמה - לבין Less than Truckload (LTL) - איחוד מספר משלוחים קטנים מלקוחות שונים באותה משאית."},
{topic:"t2", q:"מהי המשמעות התפעולית של המונח \"Last Mile\" בשרשרת האינטרמודליות?",
 options:["שלב האיסוף הראשוני של הסחורה מהיצרן בלבד","שלב ההפצה הסופי מהמסוף האזורי האחרון אל הלקוח הבודד, המאופיין בדרך כלל בעלות גבוהה יחסית ליחידת מטען","המרחק הכולל שעובר משלוח ממקורו ליעדו","שלב ההעברה בין שני כלי תובלה זהים"], correct:1,
 explain:"בדיאגרמת האינטרמודליות (Composition-Interchange-Decomposition) מסומן \"Last mile\" כשלב הפיצול הסופי מהמרכז אל יעדים מבוזרים רבים - שלב יקר יחסית ליחידת מטען בשל הפיזור."},
{topic:"t2", q:"כיצד משפיע מודל אספקה מבוסס \"Just in Time\" על מיקום המחסנים ביחס למפעלי הלקוחות, בהשוואה לגישת מלאי בטיחות גדול?",
 options:["הוא מחייב קרבה גיאוגרפית ותדירות אספקה גבוהה כדי לצמצם את הזמן והאי-ודאות עד הגעת החומרים, ולכן דוחף למיקום מחסנים קרוב יותר למפעלים","הוא מעודד ריחוק מרבי בין המחסנים למפעלים כדי לנצל עלויות קרקע זולות","הוא מבטל לחלוטין את הצורך במחסנים","אין לו כל השפעה על מיקום מחסנים"], correct:0,
 explain:"עקרון ה-Just in Time מבוסס על אספקה תכופה ומדויקת עם מלאי מינימלי, ולכן דורש קרבה גיאוגרפית וזמני תגובה קצרים - מה שמשפיע ישירות על שיקולי מיקום מחסנים קרוב למפעלים."},
{topic:"t2", q:"מדוע נחשבת \"Composition\" (איסוף ראשוני) שלב נבדל מ\"Decomposition\" (פיזור סופי) במודל האינטרמודליות?",
 options:["שני התהליכים זהים לחלוטין","Decomposition מתרחשת תמיד לפני Composition","Composition מאחדת זרימות ממקורות מבוזרים לזרימה גדולה אחת לקראת ההעברה הארצית, בעוד Decomposition מפצלת זרימה גדולה חזרה ליעדים מבוזרים רבים","Composition מתרחשת רק בנמלים ו-Decomposition רק בשדות תעופה"], correct:2,
 explain:"בדיאגרמת האינטרמודליות מוצג רצף: Composition (איחוד זרימות מ\"First mile\" מבוזר) ← Interchange (מעבר בין מסופים) ← Decomposition (פיזור לזרימות מבוזרות ב\"Last mile\") - שני קצוות סימטריים אך הפוכים בכיוונם."},
{topic:"t2", q:"אילו מרכיבים משולבים יחד בדיאגרמת \"מרכיבי התנועה\" (אמצעי, תשתיות, משתמשים, מדיניות וחוקים) לקביעת אופי מערכת התנועה?",
 options:["רק כלי הרכב עצמם, ללא קשר לתשתית או למשתמשים","שילוב של כלי הרכב, התשתית הפיזית, התנהגות המשתמשים והמסגרת הרגולטורית - כל אלו יחד קובעים את אופי המערכת","רק החוק והמדיניות, ללא רכיב פיזי כלשהו","תשתיות ומדיניות בלבד, ללא קשר למשתמשים"], correct:1,
 explain:"דיאגרמת ארבעת המעגלים החופפים בחומר מציגה את \"אמצעי (רכב)\", \"תשתיות (כביש, צינור, נתיב)\", \"משתמשים (נהג, נוסע)\" ו\"מדיניות וחוקים\" כארבעה מרכיבים המשפיעים יחד ובאינטראקציה על מערכת התנועה."},
{topic:"t2", q:"במה שונה \"RoRo\" (Roll-on/Roll-off) מהובלה במכולות בתחבורה ימית?",
 options:["RoRo מאפשר לכלי רכב או ציוד גלגלי לנוע ישירות אל תוך כלי השיט וממנו ללא צורך במנוף, בעוד מכולות דורשות ציוד הרמה ייעודי","RoRo משמש רק לנוסעים","RoRo הוא סוג של מכולה סטנדרטית","מכולות אינן ניתנות להעברה בין אניה למשאית בשום מקרה"], correct:0,
 explain:"RoRo (Roll-on/Roll-off) מבוסס על עלייה/ירידה עצמאית של ציוד גלגלי מהאנייה, בשונה מהעמסת מכולות הדורשת מנופים ומסופי מכולות ייעודיים - שיטת טעינה שונה מהותית."},
{topic:"t2", q:"מדוע קיים בהובלת מטען (Truck) פירוט רחב של סוגי מכליות (Tank, Flatbed, Reefer, Hopper וכו') ולא סוג אחד בלבד, בניגוד להובלת נוסעים שם הפירוט מצומצם יותר?",
 options:["כי מטענים שונים (נוזלים, מקורר, פתוח, יבש) דורשים תנאי הובלה שונים מבחינת הגנה, טמפרטורה וגישה לפריקה, בעוד נוסעים דורשים בעיקר מקום ישיבה בטוח","כי חוק מחייב כל מוביל להחזיק בכל סוגי המכליות","כי כל סוגי המכליות זהות תפעולית ורק שמן שונה","כי הובלת נוסעים אינה כוללת שום סוג רכב מיוחד"], correct:0,
 explain:"רשימת סוגי המכליות (Tank, Flatbed, Curtainside, Reefer, Hopper, Open top וכו') משקפת מגוון דרישות הובלה פיזיות של מטענים שונים (נוזל, קירור, פתוח), בעוד נוסע דורש בעיקר מושב בטוח - ומכאן הפער בגיוון."},
{topic:"t2", q:"מה המשמעות של קיום \"Intermodal Container\" (מכולה תקנית) לזרימת סחורות בין רכבת, אנייה ומשאית?",
 options:["היא מאפשרת העברת אותה יחידת מטען בין אמצעי תובלה שונים ללא צורך בפריקה ואריזה מחדש של התוכן בכל מעבר, ובכך מצמצמת זמן וטיפול","היא מחייבת פריקה מלאה של התכולה בכל מעבר בין אמצעי תובלה","היא רלוונטית רק לתחבורה אווירית","היא מבטלת את הצורך במסופים בין אמצעי תובלה שונים"], correct:0,
 explain:"עצם הרעיון של מכולה תקנית (ISO Container) הוא סטנדרטיזציה המאפשרת מעבר בין רכבת/אנייה/משאית ללא פריקת התוכן פיזית - זה עיקרון היסוד של Intermodality."},
{topic:"t2", q:"מדוע בטבלת \"סיווג דרכים\" מוצגים \"זרימה\" ו\"נגישות\" כשני מאפיינים המשתנים בכיוונים הפוכים בין סוגי הדרכים?",
 options:["משום שקיים טרייד-אוף מובנה: דרך שמתפקדת היטב בזרימה מהירה ורציפה מוותרת בהכרח על נגישות ישירה לחלקות הגובלות בה, ולהפך בדרך מקומית","משום שנגישות וזרימה הן תמיד אותה תכונה בדיוק","משום שדרך מהירה מספקת גם את הזרימה וגם את הנגישות הגבוהות ביותר בו-זמנית","אין כל קשר בין רמת הזרימה לרמת הנגישות בדרך נתונה"], correct:0,
 explain:"בטבלת סיווג הדרכים, החץ של \"זרימה\" עולה מדרך מקומית למהירה, בעוד החץ של \"נגישות\" יורד באותו כיוון - מה שממחיש טרייד-אוף מובנה בין השניים בתכנון דרכים."},

/* ===== t3: זרימת תנועה – מושגים ומודלים ===== */
{topic:"t3", q:"מהי המשמעות התעבורתית של הקשר q = S × D?",
 options:["הזרימה (כלי רכב לשעה) מתקבלת ממכפלת המהירות הממוצעת בצפיפות הרכבים על הכביש","הזרימה שווה תמיד לקיבולת המקסימלית של הנתיב, ללא תלות במהירות","q מייצג מרחק ולא זרימה","D בקשר זה מייצג את זמן הנסיעה ולא את הצפיפות"], correct:0,
 explain:"המשוואה הבסיסית שהוצגה בחומר היא q=S×D, כאשר q זרימה (רכבים/שעה), S מהירות (ק\"מ/שעה) ו-D צפיפות (רכבים/ק\"מ) - זהו קשר הזהות המרכזי בתורת זרימת התנועה."},
{topic:"t3", q:"במודל הקשר הליניארי בין מהירות לצפיפות (Greenshields), מדוע הזרימה המקסימלית (q_max) מתקבלת בדיוק כאשר הצפיפות שווה למחצית הצפיפות המקסימלית (D=Dj/2)?",
 options:["מפני שבצפיפות זו כל כלי הרכב נעים במהירות אפס","מפני שפונקציית הזרימה כתלות בצפיפות היא ריבועית (פרבולה), וקיצון של פרבולה כזו מתקבל באמצע התחום שבו הזרימה חיובית","מפני שזהו ערך שרירותי שאינו נובע מהמודל המתמטי","מפני שבצפיפות זו הקיבולת של הכביש מוגדרת כאפס"], correct:1,
 explain:"מהגזירה שהוצגה: q=Sf(D-D²/Dj), נגזרת זו מתאפסת ב-D=Dj/2, וזוהי בדיוק נקודת המקסימום של הפרבולה - כך מתקבל q_max במחצית הצפיפות המקסימלית."},
{topic:"t3", q:"מה קורה למהירות הממוצעת של כלי הרכב ככל שהצפיפות (D) עולה ומתקרבת לצפיפות המקסימלית (Dj), לפי המודל הליניארי?",
 options:["המהירות עולה ככל שהצפיפות עולה","המהירות נשארת קבועה ללא תלות בצפיפות","המהירות עולה בקפיצה חדה בדיוק בנקודת הקיבולת המקסימלית","המהירות יורדת בהדרגה עד להתכנסות לאפס בצפיפות המקסימלית, המתארת מצב של פקק מוחלט"], correct:3,
 explain:"לפי S=Sf(1-D/Dj), ככל ש-D שואף ל-Dj, S שואפת לאפס באופן ליניארי - זהו תיאור מתמטי למצב \"פקק\" מוחלט שבו התנועה נעצרת."},
{topic:"t3", q:"מדוע ייתכן שבאותה רמת זרימה (q) נצפים שני מצבי תנועה שונים לחלוטין - האחד \"חופשי\" והשני \"צפוף מאוד\"?",
 options:["משום שהקשר בין זרימה לצפיפות אינו חד-חד-ערכי: לאותו ערך q יכולים להתאים שני ערכי D שונים, האחד מתחת לצפיפות הקריטית והשני מעליה","משום שזרימה ומהירות הן תמיד אותו הדבר","משום שבמצב צפוף הזרימה תמיד גבוהה יותר מבמצב חופשי","לא ייתכן מצב כזה במודל הזרימה"], correct:0,
 explain:"מכיוון שגרף q מול D הוא פרבולי (עולה ואז יורד), לכל ערך q (מלבד המקסימום) מתאימים שני ערכי D אפשריים - אחד בצד העולה (זרימה חופשית) ואחד בצד היורד (עומס כבד)."},
{topic:"t3", q:"מדוע בגרף \"דפוס תנועה יומי\" מסומנות שתי רמות סף - \"Congested\" ו-\"Highly Congested\" - ביחס לקו הקיבולת?",
 options:["כדי להראות שברגעים שבהם הזרימה בפועל מתקרבת לקיבולת הנתיב או חוצה אותה נוצר עומס, ולכן שעות השיא בבוקר ובערב מסומנות בהתאם","משום שהקיבולת של הכביש משתנה מדי שעה בהתאם למספר כלי הרכב","כדי להראות שבשעות הלילה נצפה תמיד העומס הגבוה ביותר","הקיבולת אינה קשורה כלל לזרימה בפועל בגרף זה"], correct:0,
 explain:"בגרף דפוס התנועה היומי מסומן קו \"Capacity\" קבוע, ובשעות השיא (6-8 ו-16-19) הזרימה בפועל חוצה או מתקרבת אליו - ולכן הן מסומנות כ-Congested/Highly Congested."},
{topic:"t3", q:"מדוע נקבעת קיבולת (יר\"מ/נתיב/שעה) שונה לכל סוג דרך (מהירה: 2000, עורקית: 1500, מאספת: 750, מקומית: 250)?",
 options:["משום שדרכים מקומיות רחבות יותר מדרכים מהירות","ככל שדרגת הדרך נמוכה יותר גדל מספר הכניסות/יציאות והצמתים והפרעות התנועה, מה שמצמצם את יכולתה לשאת זרימה רציפה וגבוהה","כל סוגי הדרכים אמורים לשאת אותה קיבולת, אך בפועל נמדד אחרת בטעות","קיבולת הדרך תלויה אך ורק במספר התמרורים המוצבים בה"], correct:1,
 explain:"הטבלה מציגה ירידה מונוטונית בקיבולת ככל שיורדים בהיררכיית הדרכים - זה עקבי עם ההיגיון שדרכים מקומיות כוללות יותר הפרעות (צמתים, כניסות) שמצמצמות את יכולת הזרימה הרציפה."},
{topic:"t3", q:"מדוע חשוב להבחין בין \"מהירות\" (S) לבין \"זמן נסיעה\" (t) כמשתנים נפרדים בניתוח זרימת תנועה, אף ששניהם קשורים למרחק?",
 options:["משום שזמן הנסיעה מושפע גם ממספר העצירות וההפרעות לאורך המסלול ולא רק מהמהירות הרגעית, כך ששני מקטעים בעלי אותה מהירות ממוצעת יכולים להניב זמני נסיעה שונים","מהירות וזמן נסיעה הם תמיד אותו משתנה בדיוק","זמן נסיעה נמדד רק בכבישים מהירים ומהירות נמדדת רק בכבישים עירוניים","אין שום קשר מתמטי בין שני המשתנים"], correct:0,
 explain:"החומר מגדיר S, D, q ו-t כמשתנים נפרדים בזרימת תנועה. זמן נסיעה בפועל מושפע מהפרעות ועצירות שאינן משתקפות בהכרח במהירות הממוצעת בלבד, ולכן יש להתייחס אליהם כמדדים משלימים ולא זהים."},
{topic:"t3", q:"מדוע רמת מינוע מוגדרת דווקא כ\"מספר כלי רכב מנועיים ל-1,000 תושבים\" ולא כ\"מספר כלי הרכב הכולל במדינה\"?",
 options:["כדי לנרמל את המדד ביחס לגודל האוכלוסייה ובכך לאפשר השוואה הוגנת בין מדינות/ערים בגדלים שונים","מפני שמספר כלי הרכב הכולל אינו ניתן למדידה כלל","מפני שהמדד מתייחס רק לכלי רכב מסחריים","מפני שהוא מודד את שטח המדינה ביחס למספר הכבישים"], correct:0,
 explain:"בהגדרה שהובאה, רמת מינוע נמדדת ליחידת אוכלוסייה (ל-1,000 תושבים) דווקא כדי לאפשר השוואות בין-לאומיות הוגנות, כפי שנעשה בפועל בהשוואת ישראל למדינות כמו איטליה, ארה\"ב, ספרד וצרפת."},
{topic:"t3", q:"מדוע נחשבת רמת מינוע למדד רלוונטי להערכת פיתוח בר-קיימא, ולא רק מדד כלכלי גרידא?",
 options:["משום שהיא מסייעת להעריך לחצים על הסביבה הטבעית והבנויה (זיהום, צריכת קרקע, תאונות) הנובעים מהעלייה בפעילות הכלכלית וברמת החיים","משום שהיא מודדת אך ורק את הכנסות הממשלה ממכירת רכבים","משום שהיא נמדדת רק פעם אחת בעשור","משום שהיא חסרת קשר כלשהו לזיהום אוויר או לתאונות דרכים"], correct:0,
 explain:"החומר מקשר במפורש בין רמת מינוע לבין תאונות דרכים, עומסי תנועה, זיהום אוויר, בריאות האוכלוסייה, צריכת משאבים וצמצום שטחים - ומכאן הרלוונטיות שלה כמדד לפיתוח בר-קיימא."},
{topic:"t3", q:"מדוע ערכי יר\"מ למשאית בקטע הררי (למשל 8) גבוהים משמעותית מאשר בקטע מישורי (למשל 1.7)?",
 options:["במקטע הררי יכולת התאוצה והמהירות הממוצעת של משאית נמוכות משמעותית ביחס לרכב פרטי, ולכן היא \"צורכת\" יותר קיבולת יחסית מבמישור","במקטע הררי משאיות אסורות לנסיעה ולכן הערך גבוה באופן מלאכותי","הערך גבוה יותר בהרים משום שיש שם פחות כבישים","אין הבדל אמיתי, מדובר בטעות בטבלת המקור"], correct:0,
 explain:"בטבלת יר\"מ (יחידת רכב משווה) מוצג הבדל חד בין מישור, הר וצומת עבור כל סוג רכב. במעלה הררי, משאית \"תופסת\" הרבה יותר משאב זרימה יחסית לרכב פרטי בשל פערי ביצועים גדולים בתאוצה ובמהירות."},

/* ===== t4: בעיית תובלה (Transportation Problem) ===== */
{topic:"t4", q:"מהי ההגדרה הבסיסית של \"בעיית תובלה\" (Transportation Problem)?",
 options:["מציאת המסלול הקצר ביותר בין שני קודקודים ברשת","בהינתן ספקים ולקוחות בעלי היצע וביקוש ידועים, יש לספק את הביקוש בעלות הובלה כוללת מינימלית","מציאת מיקום אופטימלי למתקן בודד","מציאת מעגל שעובר בכל קשת ברשת פעם אחת לפחות"], correct:1,
 explain:"בהגדרה שהוצגה: \"קיימים ספקים ולקוחות, יש לספק את הביקוש בעלות הובלה מינימלית\" - זו ההגדרה הבסיסית של בעיית התובלה, השונה ממסלול קצר, מיקום מתקן או מעגל אוילר."},
{topic:"t4", q:"מה קורה למבנה הפתרון האופטימלי בבעיית תובלה כאשר סך ההיצע של כל הספקים גדול מסך הביקוש של כל הלקוחות?",
 options:["המודל הופך ללא פתיר, מכיוון שהמודל מחייב שהביקוש וההיצע יהיו שווים בדיוק","יש להוסיף לקוח פיקטיבי שהביקוש שלו שווה להפרש בין ההיצע לביקוש, כדי לאזן את הבעיה","ערך פונקציית המטרה יהפוך לשלילי מכיוון שהעודפים מוגדרים כרווח","כל הספקים ישלחו את מלוא הקיבולת שלהם ללקוח בעל העלות הנמוכה ביותר בלבד"], correct:1,
 explain:"בעיית תובלה קלאסית מנוסחת עם אילוצי שוויון בין סך ההיצע לסך הביקוש. כאשר ההיצע עולה על הביקוש, הפתרון המקובל הוא הוספת \"לקוח פיקטיבי\" שסופג את העודף כדי לאזן את המודל ולאפשר פתרון."},
{topic:"t4", q:"בבעיית תובלה, מה משמעות הוספת \"ספק פיקטיבי\" (ולא לקוח פיקטיבי) לאיזון הבעיה?",
 options:["מבוצעת כאשר סך הביקוש גדול מסך ההיצע, כדי לייצג את הכמות שלא ניתן לספק בפועל ללקוחות","מבוצעת תמיד ללא קשר ליחס בין היצע לביקוש","מבוצעת רק כאשר יש מספר זהה של ספקים ולקוחות","מבטלת את הצורך בפתרון הבעיה כלל"], correct:0,
 explain:"באופן סימטרי להוספת לקוח פיקטיבי כשההיצע עודף, כאשר הביקוש גדול מההיצע מוסיפים ספק פיקטיבי שמייצג את הכמות שלא ניתן לספק בפועל - כדי לשמור על איזון אילוצי השוויון במודל."},
{topic:"t4", q:"מדוע נחשבת בעיית התובלה למקרה פרטי (מובנה במיוחד) של בעיית תכנון לינארי כללית?",
 options:["משום שהיא כוללת רק שני משתני החלטה בכל מקרה","משום שמבנה האילוצים שלה (שוויון בין סכומי שורות/עמודות לכמויות היצע/ביקוש) יוצר מבנה מיוחד המאפשר שימוש בשיטות פתרון ייעודיות ויעילות יותר מסימפלקס כללי","משום שאין לה כלל פונקציית מטרה להביא למינימום/מקסימום","משום שהיא אינה ניתנת לפתרון בשיטות תכנון לינארי בכלל"], correct:1,
 explain:"מטריצת המקדמים בבעיית תובלה בעלת מבנה מיוחד (כל משתנה מופיע בדיוק באילוץ שורה אחד ואילוץ עמודה אחד), ולכן פותחו עבורה שיטות פתרון ייעודיות ויעילות מעבר לסימפלקס הכללי."},
{topic:"t4", q:"מהם השימושים העיקריים המוזכרים לבעיית התובלה בהקשר של תובלה ושינוע?",
 options:["הפצה, מיקום מרכזי הפצה ומיקום מפעלים","קביעת סדר עדיפויות לתחזוקת כלי רכב בלבד","תכנון תמרורים בצומת בודד","חישוב עומק מים בנמל"], correct:0,
 explain:"החומר מציין במפורש כי בעיית התובלה משמשת ל\"הפצה, מקיום מרכזי הפצה, מיקום מפעלים וכו'\" - כלים לתכנון רשתות אספקה ולא לתחזוקה, תמרורים או נמלים."},
{topic:"t4", q:"בגרף התובלה (ספקים מול מחסנים) בדוגמת החומר, מדוע מוצגות קשתות בין כל ספק לכל מחסן ולא רק בין ספקים סמוכים גיאוגרפית?",
 options:["מפני שבבעיית תובלה כללית כל ספק יכול, באופן עקרוני, לספק לכל לקוח, וההחלטה מהו השילוב הזול ביותר היא תוצר הפתרון ולא הנחה מראש","מפני שאסור לפי המודל לחבר ספק ללקוח מרוחק","מפני שכל הספקים חייבים לספק בדיוק לאותו לקוח","מפני שגרף התובלה אינו יכול לכלול יותר משני ספקים"], correct:0,
 explain:"בדוגמת ה-P&T Co. (מפעלי שימורים ומחסנים), כל מפעל מחובר לכל מחסן עם עלות משלוחת שונה - כי המודל בוחן את כל הצירופים האפשריים כדי לבחור בשילוב הזול ביותר, ולא מגביל מראש רק לסמוכים."},
{topic:"t4", q:"מה ההבדל המהותי בין בעיית תובלה קלאסית לבעיית שיטעון (Transshipment)?",
 options:["בבעיית שיטעון קיימים קודקודי ביניים שדרכם עוברת הזרימה בין המקורות ליעדים, ואילו בבעיית תובלה הזרימה מתבצעת ישירות ממקור ליעד","אין הבדל, שני המונחים מתארים אותה בעיה בדיוק","בבעיית תובלה חובה לעבור בכל קודקוד פעם אחת בלבד, כמו בבעיית הסוכן הנוסע","בעיית שיטעון פותרת תמיד מהירה יותר מבעיית תובלה"], correct:0,
 explain:"ההרחבה של בעיית תובלה לבעיית שיטעון היא הוספת קודקודי ביניים (transshipment nodes) שדרכם עשויה לעבור הזרימה בטרם הגעתה ליעד הסופי - שלא כמו בבעיית תובלה הקלאסית שבה הזרימה ישירה."},
{topic:"t4", q:"מדוע חשוב לוודא איזון בין סך ההיצע לסך הביקוש לפני הפעלת שיטות פתרון סטנדרטיות לבעיית תובלה?",
 options:["מפני שהמודל הבסיסי מבוסס על אילוצי שוויון (לא אי-שוויון) בין הזרימה היוצאת/נכנסת לכל צומת לבין ההיצע/ביקוש שלו, ולכן חוסר איזון הופך את מערכת האילוצים לבלתי אפשרית ללא התאמה","מפני שללא איזון, פונקציית המטרה תמיד תהיה שלילית","מפני שאיזון נדרש רק מטעמים אסתטיים ואינו משפיע על הפתרון","מפני שחוסר איזון פוסל את השימוש בגרפים לתיאור הבעיה"], correct:0,
 explain:"בניסוח הסטנדרטי אילוצי בעיית תובלה הם אילוצי שוויון (סכום השילוח מכל ספק = ההיצע שלו, וכן ללקוח). ללא איזון בין סך ההיצע לסך הביקוש, מערכת אילוצים כזו הופכת לבלתי אפשרית - ולכן נדרש איזון תחילה (בעזרת גורם פיקטיבי)."},
{topic:"t4", q:"בהקשר של מיקום מחסנים ומפעלים, מדוע נחשבת בעיית התובלה לכלי שימושי בשלב תכנון רשת ההפצה?",
 options:["היא מאפשרת להעריך את עלות ההפצה הכוללת המינימלית הנובעת משיוך מסוים בין ספקים/מפעלים ללקוחות/מחסנים, ובכך לתמוך בהחלטות מיקום ותכנון רשת","היא קובעת ישירות את מיקום המפעלים ללא צורך בניתוח נוסף כלשהו","היא רלוונטית רק לאחר שנבחר כבר מיקום סופי, ואינה תורמת לשלב הבחירה","היא מתעלמת לחלוטין מעלויות הובלה"], correct:0,
 explain:"בעיית התובלה מוזכרת כשימוש עבור \"הפצה, מיקום מרכזי הפצה, מיקום מפעלים\" - כלומר היא כלי הערכה: עבור מיקום מוצע ניתן לחשב את עלות ההפצה המינימלית, ולהשוות בין חלופות מיקום שונות."},

/* ===== t5: זרימה מקסימלית וחתך מינימלי ===== */
{topic:"t5", q:"מהי מטרת בעיית \"זרימה מקסימלית\" (Max Flow) ברשת?",
 options:["מציאת הקיבולת המקסימלית להעברה בין שתי נקודות ברשת, תוך שימוש בקשתות שלכל אחת מהן קיבולת מקסימלית משלה","מציאת המסלול הקצר ביותר בין שתי נקודות ברשת","מציאת מיקום אופטימלי למתקן יחיד","מציאת מעגל שעובר בכל קודקוד פעם אחת בדיוק"], correct:0,
 explain:"ההגדרה בחומר: \"מציאת הקיבולת המקסימלית להעברה בין שתי נקודות ברשת, תוך שימוש ברשת, כשלכל קשת ברשת קיבולת מקסימלית משלה\" - זהו הבדל מהותי ממסלול קצר, מיקום מתקן או TSP."},
{topic:"t5", q:"מהו \"מסלול אוגמנטי\" באלגוריתם פורד-פלקרסון לזרימה מקסימלית?",
 options:["מסלול מקודקוד המוצא לקודקוד היעד בעל זרימה שיורית חיובית לאורך כל קשתותיו, שדרכו ניתן להוסיף עוד זרימה מהמקור ליעד","כל מסלול אפשרי ברשת ללא תנאי נוסף","מסלול שבו כל הקשתות רוויות לחלוטין","מסלול היחיד שקיים ברשת בין המקור ליעד"], correct:0,
 explain:"בהגדרה: \"מסלול אוגמנטי - מסלול מקודקוד המוצא לקודקוד היעד בעל זרימה חיובית (גדולה מ-0)\". האלגוריתם מחפש מסלולים כאלה שוב ושוב ומוסיף לאורכם זרימה, עד שלא נותר מסלול כזה."},
{topic:"t5", q:"מדוע נדרשות ברשת של פורד-פלקרסון \"קשתות חוזרות\" (בכיוון ההפוך לזרימה המקורית) בעלות קיבולת שיורית?",
 options:["כדי לאפשר לאלגוריתם \"לתקן\" בחירת זרימה קודמת שהתבררה כלא אופטימלית, על ידי ביטול חלק מהזרימה שכבר נשלחה בקשת מסוימת דרך מסלול אחר","הן מיותרות לחלוטין ואינן משפיעות על הפתרון","הן נדרשות רק כאשר קיים קודקוד יעד יחיד","הן מבטיחות שהזרימה תמיד תהיה שווה לאפס"], correct:0,
 explain:"הדוגמה \"למה אנו צריכים את הקשתות החוזרות?\" ממחישה שבלעדיהן האלגוריתם עלול להיתקע בפתרון תת-אופטימלי, כי אין דרך \"לבטל\" זרימה שנשלחה בכיוון לא נכון ולנתב אותה מחדש."},
{topic:"t5", q:"מהי ההגדרה של \"חתך\" (Cut) בבעיית חתך מינימלי?",
 options:["קבוצת קשתות שאם נמחק אותן מהגרף לא יישאר אף מסלול מהמקור ליעד","כל תת-קבוצה אקראית של קשתות ברשת","מסלול יחיד המחבר את המקור ליעד","קודקוד בודד שדרכו עוברת כל הזרימה"], correct:0,
 explain:"ההגדרה בחומר: \"חתך: מחיקת קשתות מהגרף, כך שלא יהיה מסלול מ-S ל-T\" - כלומר קבוצת קשתות שהסרתה מנתקת לחלוטין את הקשר בין המקור ליעד."},
{topic:"t5", q:"מדוע נחשבת בעיית \"חתך מינימלי\" (Min Cut) ל\"בעיה הדואלית\" (המשלימה) של בעיית הזרימה המקסימלית?",
 options:["ערך הזרימה המקסימלית האפשרית ברשת שווה בדיוק לערך החתך המינימלי, כך שכדי למצוא את החתך המינימלי יש בפועל לפתור את בעיית הזרימה המקסימלית","הן שתי בעיות שאינן קשורות זו לזו בשום צורה","חתך מינימלי הוא תמיד גדול משמעותית מהזרימה המקסימלית","חתך מינימלי נפתר רק כאשר אין קשתות ברשת כלל"], correct:0,
 explain:"החומר קובע במפורש: \"בעיית חתך מינימלי היא הבעיה הדואלית (משלימה) של בעיית הזרימה המקסימלית... בכדי למצוא את החתך המינימלי אנו צריכים לפתור את בעיית הזרימה המקסימלית\" - זהו משפט הזרימה-חתך המקסימלי-מינימלי."},
{topic:"t5", q:"אילו קשתות ברשת שייכות ל\"חתך המינימלי\" בפתרון האופטימלי של בעיית הזרימה המקסימלית?",
 options:["הקשתות שסך הזרימה העובר בהן (ברוויה) שווה לזרימה המקסימלית הכוללת ברשת - כלומר צוואר הבקבוק שמגביל את הזרימה","כל הקשתות ברשת ללא יוצא מן הכלל","רק הקשתות היוצאות ישירות מקודקוד המקור","רק הקשתות שערכן שווה לאפס"], correct:0,
 explain:"נכתב במפורש: \"הקשתות ששייכות לחתך המינימלי הן הקשתות שסך הזרימה בהן שווה לזרימה המקסימלית\" - כלומר הקשתות הרוויות שמגבילות בפועל את היכולת להעביר יותר זרימה."},
{topic:"t5", q:"כיצד ניתן להתאים בעיית זרימה מקסימלית בעלת מספר מקורות ומספר יעדים (ולא מקור/יעד יחיד) כדי לפתור אותה באמצעות אלגוריתם סטנדרטי?",
 options:["מוסיפים קודקוד \"מקור-על\" (super source) המחובר לכל המקורות בקשתות בעלות קיבולת אינסופית, וקודקוד \"יעד-על\" (super sink) המחובר מכל היעדים באופן דומה, וכך מצמצמים לבעיה עם מקור ויעד יחיד","הבעיה אינה ניתנת לפתרון כלל כאשר יש מספר מקורות ויעדים","יש לפתור בעיה נפרדת לחלוטין עבור כל זוג מקור-יעד ואי אפשר לשלב פתרונות","מוחקים את כל המקורות והיעדים הנוספים ומשאירים רק אחד מכל סוג"], correct:0,
 explain:"בדוגמת \"בעיית זרימה מקסימלית עם מספר מקורות ויעדים\" הוצג בדיוק פתרון זה - חיבור קודקוד S יחיד לכל מקורות ה-s_i בקשתות אינסופיות, וקודקוד t יחיד המחובר מכל יעדי ה-t_i, כך שהבעיה הופכת לבעיית מקור-יעד סטנדרטית."},
{topic:"t5", q:"מהם השימושים המרכזיים המוזכרים לבעיית הזרימה המקסימלית בהקשר תחבורתי?",
 options:["פינוי אוכלוסייה, העברת כוחות ותכנון רשת","קביעת מחיר כרטיס טיסה","תזמון עובדים במחסן","בחירת צבע לרכבי חברה"], correct:0,
 explain:"החומר מציין במפורש: \"שימושים: פינוי אוכלוסייה, העברת כוחות, תכנון רשת\" כשימושים אופייניים לבעיית הזרימה המקסימלית."},
{topic:"t5", q:"מדוע הוספת \"חסם תחתון\" לקשת ברשת זרימה (חובת זרימה מינימלית, לא רק מקסימלית) נחשבת הרחבה מורכבת יותר לבעיית הזרימה המקסימלית הבסיסית?",
 options:["מפני שהיא מוסיפה אילוץ נוסף שמחייב זרימה חיובית מסוימת בקשת מסוימת ולא רק מגבילה את הזרימה מלמעלה, מה שעלול להשפיע על היתכנות הפתרון כולו ולא רק על ערכו","מפני שהיא מבטלת את קיבולת הקשת העליונה לחלוטין","מפני שהיא הופכת את הבעיה לבעיית מסלול קצר ביותר","מפני שהיא מונעת קיום זרימה כלשהי ברשת"], correct:0,
 explain:"\"הוספת חסם תחתון\" מופיעה כאחת מהרחבות בעיית הזרימה המקסימלית. חסם תחתון (בשונה מקיבולת עליונה בלבד) מוסיף דרישת מינימום שעלולה להפוך את הבעיה לבלתי אפשרית אם אין אפשרות לעמוד בה - סיבוך אמיתי מעבר למודל הבסיסי."},

/* ===== t6: בעיית שיטעון (Transshipment) ===== */
{topic:"t6", q:"מהי ההגדרה הבסיסית של בעיית שיטעון (Transshipment)?",
 options:["בעיית זרימה שבה קיימים קודקודי ביניים שדרכם עוברת סחורה בין מקורות ליעדים, כאשר בכל קודקוד ביניים סך הזרימה הנכנסת שווה לסך הזרימה היוצאת","מציאת המסלול הקצר ביותר בין קודקוד יחיד לכל שאר הקודקודים","מציאת מיקום אופטימלי למתקן בודד ללא קשר לזרימה","בעיה שבה אין קודקודי ביניים כלל, רק מקורות ויעדים ישירים"], correct:0,
 explain:"בעיית שיטעון היא הרחבה של בעיית תובלה הכוללת קודקודי ביניים (transshipment nodes), כאשר לכל קודקוד ביניים חל שימור זרימה - סך הנכנס שווה לסך היוצא, שכן הוא אינו מקור ואינו יעד."},
{topic:"t6", q:"מה ההבדל המהותי בין בעיית שיטעון לבעיית תובלה קלאסית?",
 options:["בבעיית שיטעון עלויות ההובלה קבועות ואינן תלויות בנפח, ובבעיית תובלה הן תמיד תלויות נפח","בבעיית שיטעון קיימים קודקודי ביניים (מתקני מעבר) שדרכם עוברת הזרימה, בעוד בבעיית תובלה הזרימה עוברת ישירות ממקור ליעד ללא תחנת ביניים","בעיית שיטעון פותרים רק עם אלגוריתמים היוריסטיים ובעיית תובלה רק עם סולבר","בעיית שיטעון מתעלמת מאילוצי קיבולת ומניחה שטח אחסון אינסופי בכל מתקן ביניים"], correct:1,
 explain:"ההבדל המרכזי הוא קיומם של קודקודי ביניים (transshipment nodes) בבעיית שיטעון - כפי שמודגם בדוגמת מיון המשלוחים בסקרמנטו ושיקאגו - שאינם קיימים בבעיית תובלה הבסיסית שבה הזרימה ישירה בלבד."},
{topic:"t6", q:"מדוע בקודקוד ביניים בבעיית שיטעון נדרש אילוץ שלפיו סך הזרימה הנכנסת שווה לסך הזרימה היוצאת?",
 options:["מפני שקודקוד ביניים אינו יוצר ואינו צורך סחורה בעצמו, אלא רק מעביר אותה הלאה, ולכן שימור הזרימה מבטיח שלא נוצרת ולא נעלמת כמות סחורה בקודקוד זה","מפני שזהו אילוץ שרירותי שנועד רק לפשט את החישוב","מפני שקודקוד ביניים תמיד צורך את כל הסחורה שמגיעה אליו ואינו מעביר דבר הלאה","מפני שבקודקוד ביניים תמיד נוצרת סחורה חדשה"], correct:0,
 explain:"מתקן ביניים (כגון מרכז מיון) הוא נקודת מעבר ולא צרכן/יצרן, ולכן חוק שימור הזרימה - שהוא עיקרון פיזי בסיסי בבעיות רשת - מחייב שכל מה שנכנס אליו גם יוצא ממנו."},
{topic:"t6", q:"בדוגמת \"מיון משלוחים ביעדי ביניים\" (מפעלים - Transshipment nodes - יעדי ביקוש), מדוע קיימים משתני זרימה גם ישירות ממפעל ליעד (למשל Sunnyvale-Amarillo) וגם דרך צמתי ביניים?",
 options:["כדי לאפשר לפתרון האופטימלי לבחור בין העברה ישירה לבין העברה דרך מרכז מיון/מעבר, בהתאם לעלויות היחסיות של כל אפשרות","מפני שחובה תמיד להעביר את כל הסחורה דרך צומת ביניים ולעולם לא ישירות","מפני שהחיבורים הישירים הם טעות בגרף ואינם אמורים להיות שם","מפני שהעברה ישירה אסורה על פי המודל"], correct:0,
 explain:"בדוגמת המשתנים (x16, x14, x15 וכו') קיימות הן קשתות ישירות מ-Sunnyvale ליעדים והן קשתות דרך Sacramento/Chicago - הפתרון האופטימלי של מודל התכנון הלינארי בוחר בשילוב הזול ביותר מבין כל האפשרויות."},
{topic:"t6", q:"מדוע ניתן להציג את בעיית השיטעון כבעיית תכנון לינארי עם אילוצי שוויון/אי-שוויון לכל צומת (כפי שהוצג עם ערכים חיוביים ושליליים לכל קודקוד)?",
 options:["מפני שכל קודקוד ברשת (מקור, ביניים או יעד) ניתן לתאר באמצעות \"מאזן זרימה\" - הפרש בין זרימה יוצאת לנכנסת - שחייב להתאים להיצע/ביקוש הנקי שלו (חיובי למקור, שלילי ליעד, אפס לביניים)","מפני שאסור לרשום אילוצי אי-שוויון בבעיות שיטעון","מפני שכל הקודקודים ברשת שיטעון הם תמיד זהים מבחינת סוגם","מפני שבעיית שיטעון אינה ניתנת לניסוח כתכנון לינארי כלל"], correct:0,
 explain:"בדוגמת \"מינימום עלות\" (A,B,C,D,E) כל קודקוד מתואר באילוץ מאזן זרימה משלו: לדוגמה קודקוד A עם היצע חיובי (50), קודקוד E עם ביקוש שלילי (-60), וקודקודי ביניים עם מאזן אפס - מבנה אחיד שמאפשר ניסוח כללי כתכנון לינארי."},
{topic:"t6", q:"מהם השימושים המרכזיים המוזכרים לבעיית השיטעון?",
 options:["חלוקת דואר בלבד","חישוב מסלול המילטוני יחיד","העברת סחורה בין מקורות ליעדים דרך מתקני ביניים/מיון, כגון מרכזי מיון משלוחים","קביעת מיקום אופטימלי למוכר גלידה בחוף בלבד"], correct:2,
 explain:"בדוגמאות שהוצגו (מיון משלוחים ביעדי ביניים, זרימה בין מפעלים-מרכזי מיון-יעדי ביקוש) מודגם השימוש המרכזי: תכנון זרימת סחורה יעילה דרך מתקני ביניים/מיון."},
{topic:"t6", q:"מדוע נדרשת בבעיית שיטעון לעיתים חסימת קיבולת מקסימלית על קשתות מסוימות (למשל \"uAB=10\" בדוגמה)?",
 options:["כדי לשקף מגבלה תפעולית ריאלית - כמו קיבולת פיזית של מסילה, כביש או מסוף - שאינה ניתנת לחריגה, ולא תמיד ניתן להעביר כמות בלתי מוגבלת דרך קשת נתונה","מפני שכל הקשתות ברשת שיטעון חייבות תמיד קיבולת אינסופית","כדי להבטיח שהעלות תהיה תמיד אפס","כדי לבטל את הצורך בפתרון אופטימלי"], correct:0,
 explain:"בדוגמת מינימום עלות הוצגו אילוצים כמו xAB≤10 ו-xCE≤80 - חסמי קיבולת המשקפים מגבלה תפעולית ריאלית על אותה קשת (למשל קיבולת מסוף או כביש), ולא כל קשת יכולה לשאת כמות בלתי מוגבלת."},

/* ===== t7: מיקום מתקנים – סוגים ותהליך בחירה ===== */
{topic:"t7", q:"מהי מטרת \"בעיית מיקום מתקנים\" (Facility Location Problem)?",
 options:["מציאת מיקום אופטימלי למתקן או למתקנים, בהתאם לקריטריון נתון (עלות, זמן, כיסוי וכדומה)","מיון קשתות ברשת לפי אורכן בלבד","קביעת סדר הביקור האופטימלי בכל צמתי הרשת","חישוב הזרימה המקסימלית בין שני קודקודים בלבד"], correct:0,
 explain:"ההגדרה בחומר: \"הבעיה: מציאת מיקום אופטימלי למתקן או מתקנים\", עם שימושים כמו מיקום מרכזי הפצה, מפעלים ומוקדי שילוח חירום - זו ההגדרה הבסיסית, לא מיון קשתות, ביקור בצמתים או זרימה."},
{topic:"t7", q:"מדוע נמצא \"תכנון ואסטרטגיה\" בתחילת שרשרת שלבי בחירת מיקום מתקן (לפני עיצוב רשת, סינון אתרים, בדיקת שטח ומשא ומתן)?",
 options:["מפני שרק בשלב זה נקבעים היעדים העסקיים/לוגיסטיים ארוכי הטווח שמכוונים את כל ההחלטות הבאות בתהליך, כמו רמת שירות רצויה והיקף פעילות","מפני שהתכנון האסטרטגי אינו קשור כלל להחלטת המיקום הסופית","מפני ששלב זה הוא תמיד השלב האחרון בפועל","מפני שאין צורך בסינון אתרים לאחר קביעת אסטרטגיה"], correct:0,
 explain:"תרשים \"שלבים בבחירת מיקום מתקן\" מציג רצף: תכנון ואסטרטגיה → עיצוב רשת → סינון אתרים → בדיקת שטח וניתוח כספי → משא ומתן ובחירת אתר. השלב האסטרטגי הוא הראשון כי הוא מכוון את כל השלבים הבאים."},
{topic:"t7", q:"במה שונה מודל \"רציף\" (Continuous) למיקום מתקן ממודל \"בדיד\" (Discrete)?",
 options:["במודל רציף המתקן יכול למוקם בכל נקודה במרחב, בעוד במודל בדיד הבחירה מוגבלת מראש למספר סופי של מיקומים אפשריים (מועמדים)","שני המודלים זהים לחלוטין מבחינת אופן החישוב","במודל בדיד המתקן יכול להיות בכל נקודה במרחב ובמודל רציף רק במיקומים קבועים","מודל רציף רלוונטי רק לתחבורה ימית"], correct:0,
 explain:"בסיווג המודלים למיקום מתקנים מופיעה ההבחנה \"מודל רציף מול מודל בדיד\" - רציף מאפשר מיקום בכל נקודה במישור, בעוד בדיד מגביל את הבחירה לרשימת מיקומים אפשריים מוגדרת מראש."},
{topic:"t7", q:"מדוע נבחר לעיתים \"מרחק אוקלידי\" (קו אווירי) לחישוב עלויות במיקום מתקן, על אף שבפועל התנועה מתבצעת על גבי רשת דרכים?",
 options:["מפני שהוא מספק קירוב מהיר וגס יחסית לחישוב \"מסלול מפורש לפי רשת\" המדויק יותר אך המורכב יותר לחישוב, כאשר רמת הדיוק הנדרשת בשלב מסוים אינה מצריכה ניתוח רשת מלא","מפני שהוא תמיד מדויק יותר ממרחק מסלול לפי רשת בכל מקרה","מפני שרשתות דרכים אינן ניתנות לשילוב במודלים של מיקום מתקן כלל","מפני שהוא היחיד המתאים למודל בדיד"], correct:0,
 explain:"בסיווג \"אופן חישוב העלויות\" מוצגות שלוש חלופות: מפורש (מסלול לפי רשת), מרחק אוקלידי (קו אווירי) וקווי אורך ורוחב (Rectilinear). מרחק אוקלידי הוא הפשוט והמהיר מביניהם, מתאים לשלבי סינון ראשוניים שאינם דורשים דיוק רשת מלא."},
{topic:"t7", q:"מדוע נבחנת ההבחנה בין בעיית מיקום \"סטטית\" לבעיית מיקום \"דינמית\"?",
 options:["בעיה סטטית מניחה תנאי ביקוש/היצע קבועים בזמן ההחלטה, בעוד בעיה דינמית מתחשבת בשינויים צפויים לאורך זמן (למשל גידול אוכלוסייה) ועשויה לדרוש החלטות מיקום מתפתחות","שתי הגישות מובילות תמיד לאותו פתרון בדיוק","בעיה דינמית מתעלמת מגורם הזמן לחלוטין","בעיה סטטית מתייחסת רק למתקנים ניידים"], correct:0,
 explain:"בסיווג המודלים מופיעה ההבחנה \"בעיה סטטית מול בעיה דינמית\" - כלומר האם נתוני הבעיה (ביקוש, עלויות) נתונים כקבועים ברגע נתון או משתנים לאורך אופק תכנון."},
{topic:"t7", q:"מדוע קיימת חשיבות להבחנה בין גישה \"דטרמיניסטית\" ל\"סטוכסטית\" בבעיות מיקום מתקנים?",
 options:["גישה דטרמיניסטית מניחה שכל הפרמטרים (ביקוש, עלויות) ידועים בוודאות, ואילו גישה סטוכסטית מביאה בחשבון אי-ודאות וטווח אפשרויות בפרמטרים אלה, מה שעשוי להוביל לפתרונות עמידים יותר בפני שינויים בלתי צפויים","שתי הגישות מניחות תמיד את אותם נתונים בוודאות מלאה","גישה סטוכסטית משמשת רק לבעיות ניתוב ואינה רלוונטית למיקום מתקנים","גישה דטרמיניסטית מתאימה רק כאשר יש יותר מ-100 לקוחות"], correct:0,
 explain:"בסיווג מופיעה גם ההבחנה \"דטרמיניסטי מול סטוכסטי\" - דטרמיניסטי מניח נתונים ידועים בוודאות, סטוכסטי מתחשב באי-ודאות בפרמטרים כמו ביקוש עתידי."},
{topic:"t7", q:"בבחירת מרכז לוגיסטי \"במרחק שלא יעלה על 100 ק\"מ מכל לקוח\" (לפי דוגמת A-B-C ברשת), מדוע לא ניתן להסתפק בבדיקת המרחק הכולל בין קצוות הרשת בלבד?",
 options:["מפני שהמגבלה חלה על כל לקוח בנפרד, ולכן יש לבדוק את המרחק מהמתקן המוצע לכל לקוח בנפרד ולא רק את סך אורך הרשת, כדי לוודא שאף לקוח אינו חורג מהמגבלה","מפני שמרחק כולל ומרחק לכל לקוח הם תמיד אותו הדבר","מפני שהמגבלה חלה רק על הלקוח הראשון ברשימה","מפני שאין צורך לבדוק מרחקים בבעיה מסוג זה כלל"], correct:0,
 explain:"בדוגמה A-B-C (120 ק\"מ ו-80 ק\"מ), מגבלת ה-100 ק\"מ היא אילוץ Min-Max לכל לקוח בנפרד (כמו ב\"בעיית סוכן\") - ולכן חובה לבדוק כל לקוח בנפרד ולא רק סכום כולל, שכן לקוח בודד עלול לחרוג גם אם הממוצע תקין."},
{topic:"t7", q:"מדוע נבדקים גורמים כמו \"תשתיות (חשמל, מים)\", \"עבודה וכוח עבודה\" ו\"תקנות וחוקים\" בנוסף לנגישות לרשת התחבורה בבחירת מיקום מתקן?",
 options:["מכיוון שהחלטת מיקום מתקן היא רב-ממדית, ותפעול מתקן דורש לא רק נגישות תחבורתית אלא גם זמינות משאבי ייצור/תפעול ועמידה בדרישות רגולטוריות מקומיות","מכיוון שגורמים אלה תמיד חשובים יותר מנגישות לרשת התחבורה","מכיוון שאין כל קשר בין תשתיות מקומיות לבחירת מיקום מתקן לוגיסטי","מכיוון שתקנות וחוקים רלוונטיים רק למתקני ייצור ולא למתקני הפצה"], correct:0,
 explain:"רשימת \"גורמים המשפיעים על הבחירה\" כוללת נגישות לשווקים ולרשת התחבורה, אמצעי הובלה, עבודה וכוח עבודה, עלויות, תשתיות, מתקנים מתאימים, תקנות וחוקים, מיסוי, סיוע ציבורי ומזג אוויר - מקבץ רחב שמעיד על אופי רב-ממדי של ההחלטה."},
{topic:"t7", q:"מדוע גרף \"עלות הובלה מול עלות קרקע כתלות במרחק מהחווה לשוק\" (Figure 12.6) מציג עקומת עלות כוללת בעלת מינימום, ולא עקומה מונוטונית עולה או יורדת?",
 options:["מפני שעלות ההובלה עולה ככל שהמרחק מהשוק גדל, בעוד עלות הקרקע יורדת ככל שמתרחקים מהמרכז, כך שסכום שתי המגמות המנוגדות יוצר נקודת מינימום משותפת באמצע הטווח","מפני שעלות הקרקע תמיד עולה ככל שמתרחקים מהשוק","מפני ששתי העלויות תמיד זהות בערכן בכל מרחק","מפני שעלות ההובלה יורדת ככל שמתרחקים מהשוק"], correct:0,
 explain:"בגרף מופיעים שלושה קווים: Truck (עולה), Land Value (יורד) ו-Total Cost (בעל מינימום ב-20-30 מייל בערך) - התוצאה של חיבור מגמה עולה ומגמה יורדת היא עקומת U עם נקודת אופטימום פנימית."},

/* ===== t8: מודלים למיקום מתקן ופונקציות מטרה ===== */
{topic:"t8", q:"במודל \"Rectilinear\" למיקום מתקן יחיד למינימום עלות, מדוע נבחר מיקום החציון (ולא הממוצע) בכל ציר בנפרד, בהתחשב במשקלות הלקוחות?",
 options:["מפני שהחציון המשוקלל ממזער את סכום המרחקים המשוקללים (בערך מוחלט) מהמתקן לכל הלקוחות באותו ציר, בעוד הממוצע מתאים למזעור סכום ריבועי המרחקים ולא למרחקים ליניאריים","מפני שהחציון תמיד שווה לממוצע במקרה זה","מפני שהחציון הוא תמיד המיקום עם משקל הלקוחות הגבוה ביותר בלבד","מפני שהממוצע אינו ניתן לחישוב עבור יותר משני לקוחות"], correct:0,
 explain:"בתהליך שהוצג (\"מיון הלקוחות לפי המיקום בציר בסדר עולה, חישוב מיקום החציון בהתחשב במשקלות\"), נבחר החציון המשוקלל כי המרחק Rectilinear הוא סכום ערכים מוחלטים - ולפונקציה כזו החציון הוא נקודת המינימום, בשונה מממוצע המתאים למרחקים ריבועיים."},
{topic:"t8", q:"מדוע פותרים את מודל ה-Rectilinear עבור כל ציר (X ו-Y) בנפרד, ולא באופן משולב?",
 options:["מפני שבמדד מרחק מלבני (Rectilinear/Manhattan) המרחק הכולל הוא סכום המרחקים על כל ציר בנפרד, ולכן ניתן למזער כל רכיב באופן עצמאי מבלי לפגוע באופטימליות הפתרון הכולל","מפני שאסור על פי המודל לשלב בין הצירים בשום אופן","מפני שציר X תמיד חשוב יותר מציר Y","מפני שפתרון משולב לעולם אינו אפשרי מתמטית"], correct:0,
 explain:"בדוגמת מיקום הספרייה, המיקום האופטימלי חושב \"עבור כל ציר\" בנפרד (X ואז Y) - מכיוון שמרחק Rectilinear ניתן לפירוק לסכום שני איברים בלתי-תלויים (|Δx|+|Δy|), כל אחד מהם ניתן למזער בנפרד."},
{topic:"t8", q:"מהי המשמעות של \"P-Median Model\" למיקום מתקנים?",
 options:["מיקום p מתקנים כך שסכום המרחק המשוקלל (ביקוש × מרחק) בין כל לקוח למתקן הקרוב לו ביותר יהיה מינימלי","מיקום מתקן יחיד שממקסם את מספר הלקוחות בטווח נתון בלבד","מיקום מתקנים כך שהמרחק המקסימלי ללקוח הרחוק ביותר יהיה מינימלי (Min-Max)","מציאת מסלול שעובר בכל הלקוחות פעם אחת בלבד"], correct:0,
 explain:"ברשימת \"סוגי בעיות\" מופיע \"P-Median model - מינימום ביקוש משוקלל מרחק\" - כלומר מיקום p מתקנים תוך מזעור סכום מכפלות הביקוש במרחק לכל לקוח, בשונה מ-Min-Max או כיסוי מקסימלי."},
{topic:"t8", q:"במה שונה גישת \"Min-Max\" (מזעור המרחק/הזמן ללקוח המרוחק ביותר) מגישת \"P-Median\" (מזעור ביקוש משוקלל מרחק) במיקום מתקנים?",
 options:["Min-Max שם דגש על הבטחת רמת שירות מינימלית לכל לקוח (גם המרוחק ביותר), בעוד P-Median שם דגש על מזעור העלות/מרחק הכולל במערכת ועלול להזניח לקוחות בודדים מרוחקים אם הם מהווים משקל קטן","שתי הגישות זהות לחלוטין במטרתן ובתוצאתן","Min-Max מתעלם לחלוטין ממיקום הלקוחות","P-Median מתמקד רק בלקוח הקרוב ביותר למתקן"], correct:0,
 explain:"ברשימת סוגי הבעיות שני המודלים מופיעים בנפרד: \"Min-Max - מזעור הזמן/מרחק אל הלקוח המרוחק ביותר\" לעומת \"P-Median - מינימום ביקוש משוקלל מרחק\" - האחד מבטיח רמת שירות מינימלית לכולם, השני ממטב יעילות כוללת."},
{topic:"t8", q:"מהי המטרה של מודל \"כיסוי מקסימלי\" (Maximal Coverage) במיקום מתקנים, בהשוואה למודלים שמחייבים כיסוי מלא של כל הלקוחות?",
 options:["למקם מספר מוגבל של מתקנים כך שהביקוש המכוסה בטווח שירות נתון (למשל מרחק/זמן מקסימלי) יהיה הגדול ביותר האפשרי, גם אם לא כל הלקוחות מכוסים","להבטיח בהכרח שכל לקוח יכוסה על ידי מתקן, ללא תלות במספר המתקנים הזמין","להתעלם לחלוטין ממרחק הלקוחות מהמתקנים","למקם מתקן יחיד בלבד תמיד במרכז הגיאוגרפי המדויק"], correct:0,
 explain:"\"כיסוי מקסימלי\" מופיע ברשימת סוגי הבעיות כחלופה למודלים שמחייבים כיסוי מלא - מתאים למצבים שבהם מספר המתקנים מוגבל ולא ניתן לכסות את כל הלקוחות, ולכן ממטבים את הביקוש המכוסה בפועל."},
{topic:"t8", q:"מדוע נחשבת בעיית מיקום מתקן ברשת \"שתי וערב\" (Grid Network) לתת-מקרה מעניין בתוך בעיות מיקום מתקנים כלליות?",
 options:["מפני שבמבנה רשת מסודר כמו שתי וערב, מרחקי Rectilinear תואמים באופן טבעי את מבנה הכבישים בפועל (כמו רחובות בעיר בנויה בגריד), ולכן המודל האנליטי הפשוט מתאים היטב למציאות","מפני שברשת שתי וערב תמיד קיים מתקן אחד בלבד שניתן למקם","מפני שרשת שתי וערב אינה יכולה לשמש בסיס לחישוב מרחקים כלל","מפני שברשת שתי וערב אסור להשתמש במודל Rectilinear"], correct:0,
 explain:"\"מיקום מתקן ברשת שתי וערב\" מופיע ברשימת סוגי הבעיות - זהו מקרה שבו התאמת מודל Rectilinear (מרחק לפי סכום צירים) הגיונית מבחינה מעשית, כי ערים רבות אכן בנויות בתבנית רחובות מלבנית (grid)."},
{topic:"t8", q:"מדוע נדרש להתייחס ל\"התייחסות לגודל הפיזי של המתקן\" כבעיה נפרדת ממודלי מיקום נקודתיים סטנדרטיים?",
 options:["מודלים בסיסיים רבים מתייחסים למתקן כאל נקודה חסרת ממדים, אך בפועל מתקן גדול (כגון מרכז לוגיסטי נרחב) עשוי להשפיע על מרחקי גישה בפועל ועל התאמתו לשטח הפנוי במיקום המוצע","גודל המתקן אינו משפיע לעולם על אף היבט במיקום","כל המתקנים תמיד זהים בגודלם ואין צורך להתייחס לכך","גודל המתקן רלוונטי רק למתקני נוסעים ולא למתקני מטען"], correct:0,
 explain:"\"התייחסות לגודל הפיזי של המתקן\" מופיעה ברשימת סוגי הבעיות כהרחבה נפרדת - שכן מודלים סטנדרטיים (כמו P-Median) מייצגים מתקן כנקודה, בעוד שבפועל שטח פיזי משפיע על התאמת המיקום."},
{topic:"t8", q:"מהי המשמעות של גישת \"מספר פונקציות מטרה\" (Multi-Objective, כגון Pareto Front) במיקום מתקנים, למשל שילוב בין מזעור עלות הובלה למזעור פגיעה באוכלוסייה?",
 options:["מכיוון שלעיתים קרובות שיפור במטרה אחת (למשל עלות) בא על חשבון החמרה במטרה אחרת (למשל פגיעה באוכלוסייה), נדרש להציג קבוצת פתרונות בלתי-נשלטים (Pareto) שביניהם מקבל ההחלטות בוחר לפי משקל היחסי שהוא נותן לכל מטרה","קיימת תמיד פונקציית מטרה יחידה שממטבת את כל הקריטריונים בו-זמנית ללא כל פשרה","גישה זו מתעלמת ממטרת העלות לחלוטין ומתמקדת אך ורק בפגיעה באוכלוסייה","גישה זו רלוונטית רק כאשר יש מתקן יחיד ואין צורך בבחירה בין חלופות"], correct:0,
 explain:"בגרף Pareto Front שהוצג (Uncovered % מול Average Distance) נראית עקומה יורדת - שיפור בפרמטר אחד (פחות אחוז לא-מכוסה) בא לרוב על חשבון האחר (מרחק ממוצע גדול יותר), ולכן מוצגת קבוצת פתרונות ולא פתרון יחיד."},
{topic:"t8", q:"מדוע נחשבת \"רשת הפצה היררכית\" (כגון קווי תעופה או חברות שילוח, עם מרכזים ראשיים ומשניים) לסוג נפרד של בעיית מיקום מתקנים?",
 options:["משום שהיא כוללת דרג נוסף של החלטה - לא רק היכן למקם מתקנים אלא גם כיצד לשייך מתקנים ברמות שונות (מרכזי-על ומרכזים אזוריים) זה לזה, בשונה ממיקום שכבה אחת שטוחה של מתקנים","משום שבמבנה היררכי אסור שיהיה יותר ממתקן אחד בכל רמה","משום שרשת היררכית אינה כוללת כלל זרימת סחורות בין מתקנים","משום שברשת היררכית כל המתקנים תמיד באותה רמת חשיבות בדיוק"], correct:0,
 explain:"\"רשת הפצה היררכית (קווי תעופה, חברות שילוח)\" מופיעה בראש רשימת סוגי הבעיות המורכבות יותר - שכן מדובר בבעיה רב-שכבתית שבה יש לקבוע גם את הקשר בין מתקנים ברמות שונות, לא רק את מיקומם."},

/* ===== t9: לוגיסטיקה עירונית והשפעות מיקום ===== */
{topic:"t9", q:"מהן שתי הבעיות המרכזיות המוזכרות בהקשר לוגיסטיקה עירונית (הפצה בתוככי ערים)?",
 options:["תאונות ורעש/זיהום הנובעים מפעילות אספקה בסביבה עירונית צפופה","מחסור מוחלט בכלי רכב ומחסור בעובדים בלבד","עודף שטחי חנייה וריבוי כבישים מיותרים","עלייה ברמת המינוע הכפרית בלבד"], correct:0,
 explain:"בשקף \"לוגיסטיקה עירונית\" מוצגות תחת \"בעיות\": תאונות, רעש (נסיעה, פריקה) וזיהום - אלו הבעיות המרכזיות שהוצגו, ולא מחסור בכלי רכב או עודף כבישים."},
{topic:"t9", q:"מדוע נחשבת הגבלת שעות אספקה (למשל אספקה מחוץ לשעות פעילות שיא) לפתרון אפשרי לבעיות לוגיסטיקה עירונית?",
 options:["היא מפחיתה את החפיפה הזמנית בין פעילות משאיות אספקה לבין שיא תנועת הנוסעים והולכי הרגל, ובכך מצמצמת עומס, רעש חריג ותאונות בשעות הרגישות ביותר","היא מבטלת את הצורך באספקה בעיר לחלוטין","היא מגדילה את זמן הנסיעה של כל משאית אספקה פי כמה מבלי כל תועלת","היא רלוונטית רק לערים ללא תחבורה ציבורית"], correct:0,
 explain:"תחת \"פתרונות\" בשקף לוגיסטיקה עירונית מופיע \"הספקה מחוץ לשעות הפעילות\" לצד הגבלת תנועה וחלונות זמן - כל אלו נועדו לצמצם את החפיפה בין פעילות אספקה לשיא התנועה העירונית."},
{topic:"t9", q:"מדוע נחשבים כלי רכב חלופיים דוגמת אופניים חשמליים לפריקה/משלוחים ב\"מיל האחרון\" העירוני לפתרון רלוונטי לבעיות לוגיסטיקה עירונית?",
 options:["הם קטנים וגמישים יותר מרכב מנועי סטנדרטי, ולכן מצמצמים את הצורך בעצירות ארוכות בצדי דרך, את הרעש ואת פליטת המזהמים בסביבה עירונית צפופה","הם מסוגלים לשאת נפח מטען זהה למשאית סטנדרטית בכל מקרה","הם נועדו אך ורק לתחבורת נוסעים ולא למשלוחים כלל","הם אסורים לשימוש בכל הערים ואינם רלוונטיים בפועל"], correct:0,
 explain:"התמונות בשקף לוגיסטיקה עירונית מציגות אופניים/רכבים קטנים למשלוחים עירוניים - כלים אלה מצמצמים גודל, רעש וזיהום ביחס למשאית רגילה, מתאימים יותר לסביבה צפופה."},
{topic:"t9", q:"מדוע \"חלונות זמן\" (הנקבעים לעיתים על ידי רשויות) נחשבים לכלי מדיניות מרכזי בניהול לוגיסטיקה עירונית?",
 options:["הם מאפשרים לרשות להגביל את שעות ואת אזורי כניסתם של כלי רכב כבדים לאזורים רגישים, ובכך לאזן בין הצורך התפעולי של המפיצים לבין רווחת התושבים","הם מחייבים שכל אספקה תתבצע רק בשעה 12:00 בכל יום בדיוק","הם מבטלים את הסמכות של הרשויות בנושא הפצה עירונית","הם רלוונטיים רק להובלה ימית ולא להפצה יבשתית"], correct:0,
 explain:"\"חלונות זמן (רשויות)\" מופיע במפורש כפתרון בשקף לוגיסטיקה עירונית - כלי המאפשר לרשויות להגביל מתי ואיפה כלי רכב כבדים יכולים לפעול, לצורך איזון בין תפעול לרווחת התושבים."},
{topic:"t9", q:"מדוע נבחנת יעילות פריקת מטען (\"ניצול עמדות, משך פריקה\") כגורם משפיע בלוגיסטיקה עירונית?",
 options:["פריקה ממושכת או לא יעילה מותירה כלי רכב חונה זמן רב באזור צפוף, מה שמגביר את חסימת התנועה ואת חוסר הזמינות של עמדות פריקה ללקוחות/מפיצים נוספים","פריקה מהירה תמיד גורמת לפגיעה בבטיחות ולכן יש להאט אותה במכוון","זמן הפריקה אינו משפיע כלל על זרימת התנועה סביב אזור הפריקה","עמדות פריקה בעיר תמיד זמינות ללא הגבלה בכל שעה"], correct:0,
 explain:"\"פריקה יעילה (ניצול עמדות, משך פריקה)\" מופיעה כפתרון בשקף לוגיסטיקה עירונית - פריקה ארוכה חוסמת עמדות ומעכבת תנועה סביבה, ולכן ייעולה מסייע לצמצום עומסים."},
{topic:"t9", q:"מהו התפקיד של \"מערכות מידע\" (סינכרוני/אסינכרוני) בהתמודדות עם אתגרי לוגיסטיקה עירונית?",
 options:["הן מאפשרות תיאום מידע בזמן אמת (סינכרוני) או בפערי זמן (אסינכרוני) בין מפיצים, נהגים ותשתיות עירוניות, כדי לייעל תזמון אספקה ולהפחית עומסים בלתי צפויים","הן משמשות אך ורק לחישוב מסלול המילטוני ואין להן קשר ללוגיסטיקה עירונית","הן מבטלות את הצורך בתיאום אנושי כלשהו בכל מקרה","הן רלוונטיות רק להובלה בין-לאומית ולא להפצה עירונית"], correct:0,
 explain:"\"מערכות מידע - סינכרוני / אסינכרוני\" מופיעה ברשימת הפתרונות ללוגיסטיקה עירונית - כלי תיאום המסייע לתזמן פעילות אספקה ולצמצם עומסים בלתי צפויים באמצעות זרימת מידע."},
{topic:"t9", q:"מדוע נבחנות השפעות \"תחבורתיות\" (תנועת כלי רכב, עלויות נסיעה) לצד השפעות \"כלכליות\" (פיתוח תשתיות, משיכת עסקים) בבחירת מיקום מתקן לוגיסטי?",
 options:["מיקום מתקן משפיע בו-זמנית הן על מערכת התחבורה הסובבת (עומסים, זמינות דרכים) והן על הכלכלה המקומית (תעסוקה, פיתוח), ושתי ההשפעות הללו רלוונטיות במקביל לקבלת החלטה מושכלת","השפעות תחבורתיות וכלכליות הן תמיד זהות ואין ביניהן הבדל מהותי","השפעות כלכליות רלוונטיות רק למתקני נוסעים","השפעות תחבורתיות רלוונטיות רק כאשר אין תחבורה ציבורית באזור"], correct:0,
 explain:"בשקף \"השפעות\" מוצגות שתי קטגוריות נפרדות: תחבורתיות (תנועת כלי רכב, עלויות נסיעה, שרשרת ההספקה) וכלכליות (פיתוח תשתיות, פעילות כלכלית, משיכת עסקים) - שתיהן נבחנות במקביל כי מיקום מתקן משפיע על שתי המערכות בו-זמנית."},
{topic:"t9", q:"מדוע נחשבת \"סביבה, זיהום ורעש\" קטגוריה נפרדת מ\"בטיחות ובטחון\" בהשפעות מיקום מתקן, אף שהן קשורות זו לזו?",
 options:["זיהום ורעש עוסקים בעיקר בהשפעות סביבתיות מתמשכות על איכות החיים והבריאות הציבורית, ואילו בטיחות ובטחון עוסקים בעיקר בסיכון לפגיעה מיידית (תאונות, אירועים) - שתי סוגיות שונות באופיין גם אם קשורות לאותה פעילות תחבורתית","שתי הקטגוריות מתייחסות בדיוק לאותו סוג נזק ואין ביניהן הבדל", "בטיחות ובטחון רלוונטיים רק למתקני ייצור ולא למתקני הפצה", "זיהום ורעש נמדדים רק פעם אחת בעשור ואינם רלוונטיים לניתוח שוטף"], correct:0,
 explain:"בשקף \"השפעות\" תת-הפריטים תחת \"תחבורתיות\" מפרידים בין \"סביבה, זיהום, רעש, אנרגיה\" לבין \"בטיחות, בטחון\" - הבחנה בין נזק סביבתי מתמשך לבין סיכון בטיחותי/ביטחוני נקודתי, למרות ששניהם נובעים מאותה פעילות."},

/* ===== t10: מסלול קצר ואלגוריתם דייקסטרה ===== */
{topic:"t10", q:"מדוע לא ניתן להפעיל את אלגוריתם דייקסטרה בגרף שבו קיימות קשתות בעלות משקל שלילי?",
 options:["האלגוריתם מבוסס על אסטרטגיה חמדנית שמקבעת את המרחק לקודקוד ברגע שנבחר, ואם קיימת קשת שלילית בהמשך הרשת שעשויה להציע מרחק קצר יותר, האלגוריתם לא יעדכן קודקודים שכבר נקבעו כסופיים","קשתות שליליות גורמות תמיד לגרף להיות בלתי קשיר לחלוטין","אלגוריתם דייקסטרה אינו מסוגל לעבוד על גרפים מכוונים כלל","קשתות שליליות הופכות את הגרף לבלתי מזוין"], correct:0,
 explain:"החומר מציין במפורש: \"האלגוריתם פועל כאשר בגרף לא קיימות קשתות בעלות משקל שלילי\". הסיבה היא שהאלגוריתם החמדני מקבע קודקוד כ\"סופי\" ברגע שנבחר, בהנחה שאין מסלול קצר יותר דרך קשת שטרם התגלתה - הנחה שמופרת כאשר יש משקל שלילי."},
{topic:"t10", q:"מדוע מכונה אלגוריתם דייקסטרה \"אלגוריתם חמדני\" (Greedy)?",
 options:["בכל שלב הוא בוחר את הקודקוד הבלתי-מבוקר בעל המרחק הזמני הקטן ביותר, מתוך הנחה שבחירה זו היא הטובה ביותר האפשרית באותו רגע, מבלי לחזור ולשקול חלופות מאוחר יותר עבור אותו קודקוד","הוא בוחר תמיד את הקודקוד הרחוק ביותר בכל שלב","הוא בודק את כל המסלולים האפשריים בגרף לפני קבלת החלטה סופית","הוא מבוסס על ניחוש אקראי של סדר הקודקודים"], correct:0,
 explain:"החומר קובע: \"אלגוריתם של דייקסטרה הינו אלגוריתם חמדני\". בכל שלב הוא בוחר, מבין הקודקודים שלא ביקרו בהם, את זה עם המרחק הזמני הקטן ביותר וקובע אותו כסופי - החלטה מקומית שאינה נבחנת מחדש."},
{topic:"t10", q:"בשלב האיתחול של אלגוריתם דייקסטרה, מדוע מסומן המרחק לכל הקודקודים (מלבד קודקוד המקור) כ\"אינסוף\"?",
 options:["כדי לייצג את העובדה שבשלב זה טרם נמצא כל מסלול ידוע מהמקור לקודקודים אלו, כך שכל מרחק סופי שיתגלה בהמשך יהיה בהכרח קטן מהערך ההתחלתי וישפר אותו","כי לא ניתן להגיע לקודקודים אלו בשום שלב של האלגוריתם","כי אינסוף הוא המרחק הסופי הנכון עבור כל קודקוד בגרף מחזורי","כי כך מוגדר תמיד המרחק של קודקוד המקור עצמו"], correct:0,
 explain:"בשלב האיתחול שהוצג: \"עבור כל קודקוד נסמן את המרחק אליו כ-∞, את המרחק של קודקוד המקור נסמן כ-0\". האינסוף הוא ערך התחלתי שמבטיח שכל גילוי מסלול אמיתי ישפר (יקטין) אותו."},
{topic:"t10", q:"מהי המשמעות התפעולית של עדכון קודקוד שכן ב\"מרחק חדש קטן יותר\" באלגוריתם דייקסטרה, במקום להשאיר את הערך הקיים?",
 options:["מבטיח שבסיום האלגוריתם כל קודקוד יחזיק במרחק המינימלי האמיתי מהמקור אליו, ולא רק במרחק הראשון שהתגלה במקרה בסדר הבדיקה","מבטל את הצורך להמשיך את האלגוריתם לקודקודים נוספים","גורם למרחק להתעדכן תמיד לערך גדול יותר בלבד","רלוונטי רק לקודקוד המקור עצמו"], correct:0,
 explain:"החומר מפרט: \"אם כבר הגענו לקודקוד השכן הזה, אך המרחק החדש קטן יותר, נתקן את נתוני הקודקוד בהתאם\" - זה מבטיח שהאלגוריתם תמיד שומר את המרחק הקטן ביותר שהתגלה עד כה, לא רק את הראשון."},
{topic:"t10", q:"מהי המטרה של גישת \"K-Shortest Paths\" בהשוואה לפתרון בעיית המסלול הקצר הבודד?",
 options:["למצוא לא רק את המסלול הקצר ביותר האחד, אלא רשימה מדורגת של K מסלולים חלופיים, כדי לספק גמישות (למשל למקרה חסימה/תאונה) ולא להסתמך על אפשרות בודדת בלבד","למצוא את המסלול הארוך ביותר האפשרי ברשת K פעמים","להחליף את המרחק בין כל קודקוד לקודקוד סמוך ב-K","לוודא שקיים מסלול המילטוני ברשת"], correct:0,
 explain:"בדוגמת Google Maps שהוצגה, מוצעים מספר מסלולים מדורגים (כמו \"דרך כביש 4\", \"דרך כביש 4 וכביש 5\" וכו') - זהו הרעיון של K-Shortest Paths: לא רק פתרון יחיד אלא רשימה של חלופות מדורגות."},
{topic:"t10", q:"בגישת K-Shortest Paths, מדוע יש לצרף לרשימת המועמדים את \"כל ההטיות\" (deviations) של המסלול ה-N שנמצא, ולא רק את המסלול הבא בסדר גודל?",
 options:["מכיוון שהמסלול ה-(N+1) הקצר ביותר עשוי לסטות מהמסלול ה-N בכל אחד מקודקודיו, ולכן יש לבחון שיטתית את כל נקודות הסטייה האפשריות כדי להבטיח שלא מפספסים מסלול קצר יותר שטרם נבדק","מכיוון שכל ההטיות תמיד זהות זו לזו ולכן אין הבדל אילו בודקים","מכיוון שההטיות הן היחידות הרלוונטיות ואילו המסלול המקורי אינו רלוונטי כלל להמשך","מכיוון שההטיות תמיד ארוכות יותר מכל מסלול אחר האפשרי"], correct:0,
 explain:"האלגוריתם שהוצג: \"צרף לרשימת המועמדים את כל ההטיות של מסלול N\" - זו הבטחה שיטתית שכל האפשרויות הסמוכות למסלול הידוע נבדקות, שכן המסלול הבא בגודלו יכול לסטות מכל קודקוד לאורך המסלול הקודם."},
{topic:"t10", q:"מדוע מדד \"מסלול קצר\" ברשת תחבורה אינו חייב להתבסס דווקא על מרחק פיזי (ק\"מ), אלא לעיתים על זמן נסיעה או עלות?",
 options:["המשקל שמוצב על כל קשת יכול לייצג כל מדד רלוונטי לבעיה (מרחק, זמן, עלות דלק, אגרה וכדומה), ואלגוריתם דייקסטרה עצמו אדיש לפרשנות המשקל כל עוד הוא אינו שלילי - כך שניתן להתאים את המדד למטרת הניתוח", "אלגוריתם דייקסטרה מוגדר לפעול רק עם משקלי מרחק פיזי בלבד", "זמן נסיעה ועלות אינם ניתנים לייצוג כמשקל קשת בגרף", "מרחק פיזי הוא המדד היחיד המשפיע בפועל על החלטות תחבורה"], correct:0,
 explain:"בדוגמאות המפה שהוצגו (כגון \"בעיית המסלול הקצר\") המספרים על הקשתות מייצגים אורך וזמן נסיעה בו-זמנית (למשל 5462140,7 - אורך,זמן) - כלומר המשקל הוא כללי ואינו מוגבל אך ורק למרחק פיזי."},
{topic:"t10", q:"מדוע חשוב לתעד בכל שלב של אלגוריתם דייקסטרה לא רק את \"המרחק\" לכל קודקוד אלא גם \"מאיזה קודקוד הגענו אליו\"?",
 options:["בלי מידע זה ניתן לדעת רק את ערך המרחק המינימלי, אך לא ניתן לשחזר את המסלול המלא (רצף הקודקודים) שמוביל אליו מהמקור", "מידע זה נדרש רק כדי לחשב את סכום המשקלים בגרף ואינו קשור למסלול עצמו", "מידע זה נדרש רק בקודקוד המקור ובשום קודקוד אחר", "מידע זה מיותר לחלוטין ואינו נדרש בשום שלב של האלגוריתם"], correct:0,
 explain:"בדוגמה שהוצגה מסומן לכל קודקוד גם \"מספר/קודקוד קודם\" (למשל 7/v6 - מרחק 7 דרך v6) - בעזרת שרשור אחורי של סימונים אלה משחזרים את המסלול המלא, כפי שנעשה בטבלת \"V1-V2 7 V1-V4-V6-V2\" וכו'."},
{topic:"t10", q:"מדוע נחשבת בעיית \"המסלולים הקצרים ביותר מקודקוד יחיד לשאר הקודקודים\" (Single-Source Shortest Path) שונה מבעיית מציאת מסלול קצר בין שני קודקודים ספציפיים בלבד?",
 options:["הפתרון לבעיית קודקוד-לכל-הקודקודים (כמו דייקסטרה) מספק בבת אחת את כל המרחקים הקצרים מהמקור לכל יתר הקודקודים ברשת, בעוד בעיה של שני קודקודים ספציפיים עשויה להסתפק לעיתים בפתרון חלקי יותר", "שתי הבעיות זהות תמיד בתוצאתן ואין הבדל מעשי ביניהן", "בעיית קודקוד יחיד לכל הקודקודים אינה ניתנת לפתרון בכלל", "אלגוריתם דייקסטרה משמש רק לבעיית שני קודקודים ולעולם לא לבעיית כל הקודקודים"], correct:0,
 explain:"ההגדרה בחומר: \"עבור רשת בעלת משקלים... מהם המסלולים הקצרים ביותר מקודקוד נתון s לכל שאר הקודקודים בגרף\" - דייקסטרה פותר את כל הבעיה בבת אחת (מקור לכל היעדים), יתרון מובנה על פני פתרון נקודתי לזוג יחיד."},

/* ===== t11: TSP, מחלק הדואר הסיני ו-VRP ===== */
{topic:"t11", q:"מה ההבדל בין \"מסלול המילטוני\" ל\"מעגל המילטוני\" בגרף בלתי מכוון?",
 options:["מסלול המילטוני עובר בכל קודקוד פעם אחת בלבד ואינו חוזר לנקודת המוצא, בעוד מעגל המילטוני עובר בכל קודקוד פעם אחת (למעט קודקוד המוצא שבו עובר פעמיים - בתחילה ובסוף)", "שני המונחים זהים לחלוטין ומתארים אותו דבר", "מסלול המילטוני חייב לעבור בכל קשת פעם אחת, בעוד מעגל המילטוני עובר בכל קודקוד פעם אחת", "מעגל המילטוני קיים רק בגרפים מכוונים"], correct:0,
 explain:"ההגדרה המדויקת בחומר: \"מסלול המילטוני - עובר דרך כל קודקוד פעם אחת בלבד\", לעומת \"מעגל המילטוני - עובר בכל קודקוד פעם אחת, פרט לקודקוד ממנו יצא שבו הוא עובר בדיוק פעמיים - בהתחלה ובסוף\"."},
{topic:"t11", q:"מדוע בעיית הסוכן הנוסע (TSP) מוגדרת עבור \"גרף שלם\" (שבו קיימת קשת בין כל זוג קודקודים)?",
 options:["כדי להבטיח שקיימת אפשרות עקרונית לעבור מכל קודקוד לכל קודקוד אחר ישירות, כך שניתן תמיד למצוא מעגל המילטוני כלשהו ולבחון את עלותו, גם אם בפועל חלק מהקשתות יקרות מאוד", "כדי להבטיח שלא ניתן למצוא כל מעגל בגרף בשום מקרה", "כדי לוודא שכל הקשתות בגרף הן בעלות משקל שלילי", "כדי להגביל את מספר הקודקודים לשניים בלבד"], correct:0,
 explain:"החומר קובע: \"הבעיה מוגדרת עבור גרף שלם\". דרישה זו מבטיחה שתמיד קיים לפחות מעגל המילטוני אחד לבדוק - אם הגרף אינו שלם, ייתכן שלא יהיה מעגל כזה כלל, מה שהופך את הבעיה לבלתי מוגדרת."},
{topic:"t11", q:"מדוע נחשבת בעיית הסוכן הנוסע לבעיה \"קשה מאוד\" (NP-Hard) מבחינת סיבוכיות חישובית?",
 options:["מספר המעגלים ההמילטוניים האפשריים בגרף שלם גדל באופן פקטוריאלי (מעריכי) עם מספר הקודקודים, כך שבדיקה ממצה של כל האפשרויות הופכת בלתי מעשית כבר עבור מספר בינוני של קודקודים", "מספר הקודקודים בבעיית TSP תמיד קטן משניים ולכן קשה לפתור", "אין לבעיה זו כל פתרון אפשרי בשום גרף", "האלגוריתם של דייקסטרה פותר תמיד את בעיית TSP בזמן פולינומי"], correct:0,
 explain:"החומר קובע: \"סיבוכיות גבוהה מאד (NP-HARD - בלתי פתיר אופטימאלית)\". הסיבה היא שמספר הסדרים האפשריים לביקור בכל הקודקודים גדל פקטוריאלית, ומכאן שאין אלגוריתם ידוע שפותר את הבעיה בזמן פולינומי במקרה הכללי - בשונה מדייקסטרה למשל."},
{topic:"t11", q:"מהו העיקרון שבבסיס אלגוריתם \"השכן הקרוב ביותר\" (חמדני) לפתרון מקורב לבעיית הסוכן הנוסע?",
 options:["בכל שלב עוברים מהקודקוד הנוכחי אל הקודקוד הבלתי-מבוקר הקרוב ביותר אליו, ומחברים ביניהם בקשת בעלת המשקל המינימלי, וממשיכים כך עד לכיסוי כל הקודקודים", "בוחרים בכל שלב את הקודקוד הרחוק ביותר מהקודקוד הנוכחי", "בודקים את כל הקומבינציות האפשריות של סדר הביקור לפני קבלת החלטה", "מתעלמים לחלוטין ממשקלי הקשתות ובוחרים קודקוד באופן אקראי בלבד"], correct:0,
 explain:"האלגוריתם שהוצג: \"נבחר קודקוד באופן אקראי; נחפש את הקודקוד הקרוב ביותר אליו, ונחבר בניהם את הקשת עם המשקל המינימאלי\" וכן הלאה - זהו בדיוק עיקרון החמדנות: תמיד בוחרים את הקרוב ביותר בשלב הנוכחי."},
{topic:"t11", q:"מהי המשמעות של הביטוי \"SOpt ≤ SAlg ≤ 2·SOpt\" ביחס לאלגוריתם השכן הקרוב ביותר לבעיית TSP?",
 options:["תוצאת האלגוריתם החמדני אינה יכולה להיות טובה יותר מהפתרון האופטימלי, אך במקרה הגרוע ביותר עלולה להיות עד פי שניים גרועה ממנו - כלומר האלגוריתם מספק קירוב עם חסם עליון ידוע, לא בהכרח פתרון מדויק", "תוצאת האלגוריתם תמיד שווה בדיוק לפתרון האופטימלי", "תוצאת האלגוריתם תמיד גרועה יותר מפי 10 מהפתרון האופטימלי", "אי אפשר לדעת דבר על היחס בין תוצאת האלגוריתם לפתרון האופטימלי"], correct:0,
 explain:"החומר מציין במפורש: \"נסמן את תוצאת האלגוריתם כ-SAlg, תוצאת האלגוריתם ביחס לפתרון האופטימאלי הוא SOpt≤SAlg≤2SOpt\" - זהו חסם תיאורטי המבטיח שהאלגוריתם החמדני לא יסטה יותר מפי שניים מהפתרון האמיתי הטוב ביותר."},
{topic:"t11", q:"מהי מטרת \"בעיית מחלק הדואר הסיני\" (Chinese Postman Problem), ובמה היא נבדלת מהותית מבעיית הסוכן הנוסע?",
 options:["מטרתה למצוא מעגל שעובר בכל קשת ברשת לפחות פעם אחת בעלות מינימלית, בעוד TSP מחפש מעגל שעובר בכל קודקוד פעם אחת - כלומר הדגש עובר מכיסוי קודקודים לכיסוי קשתות", "שתי הבעיות זהות לחלוטין במטרתן", "מחלק הדואר הסיני עוסק בכיסוי קודקודים בדיוק כמו TSP", "מטרתה למצוא את הקודקוד המרכזי ביותר ברשת בלבד"], correct:0,
 explain:"ההגדרה בחומר: \"הבעיה: מציאת מעגל בגרף שעובר בכל קשת לפחות פעם אחת בעל משקל מינימאלי\" - ההבדל המהותי מ-TSP הוא שהמטרה כאן כיסוי כל הקשתות (לא הקודקודים), כמו נתב דואר שחייב לעבור בכל רחוב."},
{topic:"t11", q:"מהם השימושים האופייניים המוזכרים לבעיית מחלק הדואר הסיני?",
 options:["חלוקת דואר, איסוף אשפה ותכנון מסלול הליכה במוזאון", "מציאת המסלול הקצר ביותר בין שתי ערים בלבד", "מיקום מרכז הפצה יחיד", "חישוב זרימה מקסימלית ברשת חשמל"], correct:0,
 explain:"החומר מציין במפורש: \"שימושים: חלוקת דואר, איסוף אשפה, תכנון מסלול הליכה במוזאון\" - כל אלו מקרים שבהם יש לעבור בכל \"קשת\" (רחוב, מסדרון) לפחות פעם אחת."},
{topic:"t11", q:"מהי ההגדרה הבסיסית של בעיית \"ניתוב רכבים\" (Vehicle Routing Problem, VRP)?",
 options:["שיבוץ רכבים (אחד או יותר) למשימות/לקוחות בהינתן אילוצים שונים (קיבולת, זמן), במטרה להקטין עלויות/זמנים/מרחקים כוללים", "מציאת מיקום אופטימלי יחיד למתקן ללא קשר לרכבים", "מציאת המסלול הקצר ביותר בין שני קודקודים בלבד ללא התייחסות לצי רכבים", "חלוקת סחורה בין שני ספקים בלבד ללא מגבלת קיבולת"], correct:0,
 explain:"ההגדרה בחומר: \"הבעיה: שיבוץ רכבים למשימות בהינתן אילוצים שונים ובמטרה להקטין עלויות/זמנים/מרחקים\" - זו הגדרה רחבה יותר מבעיית מסלול קצר בודד או מיקום מתקן."},
{topic:"t11", q:"מדוע נחשבת בעיית VRP סבוכה יותר מבעיית TSP הבסיסית, אף ששתיהן עוסקות בתכנון מסלולים?",
 options:["ב-VRP יש להתחשב בו-זמנית במספר כלי רכב, במגבלות קיבולת שלהם, ולעיתים גם בחלונות זמן ובמספר מוקדים, בעוד TSP הבסיסית עוסקת בכלי רכב יחיד ללא מגבלת קיבולת שמבקר בכל הלקוחות", "VRP עוסקת תמיד ברכב יחיד בלבד בדיוק כמו TSP, ולכן אין כל הבדל בסיבוכיות", "TSP תמיד קלה יותר לפתרון פולינומי בעוד VRP תמיד ניתנת לפתרון מיידי", "VRP אינה כוללת כלל מגבלות קיבולת, ולכן היא פשוטה יותר מ-TSP"], correct:0,
 explain:"טבלת \"מאפייני VRP\" מציגה מגוון רחב של מימדים נוספים - גודל צי, סוג צי, מיקום רכבים, אופי ומיקום ביקוש, מגבלות קיבולת וזמן - כל אלה מעבר למה ש-TSP הבסיסית (רכב יחיד) נדרשת להתמודד איתו."},
{topic:"t11", q:"מדוע עבור צי גדול של כ-150 לקוחות יעדיף מנהל לוגיסטי כמעט תמיד להשתמש בשיטה היוריסטית לפתרון VRP ולא בשיטה מדויקת?",
 options:["מכיוון שבעיית VRP היא בעיה קשה מאוד מבחינה חישובית (NP-Hard), ופתרון מדויק עבור מספר לקוחות גדול כזה עלול לדרוש זמן חישוב עצום, בעוד שיטה היוריסטית מספקת פתרון קרוב לאופטימום תוך דקות או שניות", "שיטות מדויקות אינן מסוגלות לטפל באילוצים פשוטים כמו קיבולת ועלויות נסיעה קבועות", "שיטות היוריסטיות מבטיחות תמיד להגיע לאופטימום המוחלט ב-100% מהמקרים", "שיטות מדויקות אינן ישימות כלל לכלי רכב הנוסעים בכבישים"], correct:0,
 explain:"החומר מציין: \"סיבוכיות גבוהה מאד עבור ניתוב רכב בודד... אלגוריתמים בדרך כלל ייעודיים לבעיה, חלקם היוריסטיים או מקורבים\" - סיבוכיות זו מחריפה עוד יותר עם מספר לקוחות גדול, ומכאן ההעדפה לשיטות היוריסטיות בפרקטיקה."},
{topic:"t11", q:"מהו ההבדל בין \"חלון זמן קשיח\" ל\"חלון זמן גמיש\" בהרחבת בעיית VRP הכוללת חלונות זמן (Time Window)?",
 options:["חלון קשיח מחייב הגעה בטווח הזמן המדויק שנקבע ללא חריגה, בעוד חלון גמיש מאפשר סטייה מסוימת (למשל בקנס כספי) מהטווח שנקבע, מה שמעניק גמישות תפעולית נוספת בתכנון המסלולים", "שני סוגי החלונות מחייבים תמיד הגעה בדיוק באותה שנייה בדיוק", "חלון זמן גמיש פירושו שאין כל מגבלת זמן על ההגעה", "חלון זמן קשיח רלוונטי רק לתחבורת נוסעים ולא למשלוחים"], correct:0,
 explain:"בשקף \"הרחבות\" מופיע במפורש \"חלון זמן קשיח / גמיש / מרובה\" - הבדל בין דרישה נוקשה להגעה בטווח מדויק לבין אפשרות לסטייה מבוקרת, המשפיעה על מידת החופש בתכנון מסלולי הרכבים."},
{topic:"t11", q:"מדוע נחשבת בעיית E-VRP (ניתוב רכבים חשמליים) להרחבה מורכבת יותר מ-VRP רגילה עבור כלי רכב מבוססי דלק?",
 options:["יש להתחשב במגבלת טווח הנסיעה על סוללה ובמיקום תחנות הטעינה הזמינות לאורך המסלול, בעוד רכב דלק יכול לרוב להשלים מסלול ארוך יותר ללא צורך בהתחשבות דומה בתחנות תדלוק לאורך הדרך", "רכב חשמלי אינו יכול לבצע כלל משלוחים מרובי לקוחות", "אין הבדל מהותי בין E-VRP ל-VRP רגילה", "E-VRP מתעלמת לחלוטין ממגבלת הקיבולת של הרכב"], correct:0,
 explain:"החומר מגדיר E-VRP: \"תכנון מסלול לרכבים חשמליים, מחייב התייחסות למיקום תחנות טעינה\" - כפי שמודגם בדוגמת המפה עם סמלי Charging Station ורמת סוללה (Battery Level) לאורך המסלול, מגבלה שאינה קיימת באותה עוצמה ברכב דלק רגיל."},


/* ===== t12: מסלולי ומעגלי אוילר (בעיית גשרי קניגסברג) ===== */
{topic:"t12", q:"מהי בעיית גשרי קניגסברג, ומדוע היא נחשבת לנקודת המוצא ההיסטורית של תורת הגרפים?",
 options:["אוילר תרגם את השאלה האם ניתן לעבור בכל 7 גשרי העיר פעם אחת בדיוק (ולחזור לנקודת המוצא) למודל מופשט של קודקודים וקשתות, והוכיח שהדבר בלתי אפשרי - הישג הנחשב לראשית תורת הגרפים","הבעיה עסקה במציאת המסלול הקצר ביותר בין שתי יבשות בעיר","אוילר הוכיח שבכל גרף ניתן תמיד למצוא מסלול כזה, ללא יוצא מן הכלל","לבעיה לא היה כל קשר לתורת הגרפים, והיא נפתרה באמצעים הנדסיים בלבד"], correct:0,
 explain:"תושבי קניגסברג חיפשו מסלול העובר בכל אחד משבעת גשרי העיר פעם אחת בלבד. אוילר ייצג כל יבשה כקודקוד וכל גשר כקשת, והוכיח שהדבר בלתי אפשרי במבנה הזה - זו נקודת המוצא ההיסטורית של תורת הגרפים."},
{topic:"t12", q:"מהי \"דרגת קודקוד\" (Degree) בגרף, וכיצד היא קשורה לתנאי לקיום מסלול אוילר?",
 options:["דרגת קודקוד היא מספר הקשתות המחוברות אליו; מסלול אוילר (שאינו מעגל) קיים בגרף קשיר רק אם יש בו בדיוק 0 או 2 קודקודים בעלי דרגה אי-זוגית", "דרגת קודקוד היא מספר הפעמים שביקרו בו; מסלול אוילר קיים רק אם כל הקודקודים בדרגה אי-זוגית", "דרגת קודקוד אינה קשורה כלל לקיום מסלול אוילר", "דרגת קודקוד נמדדת רק במעגלים ולא במסלולים"], correct:0,
 explain:"דרגת קודקוד = מספר הקשתות המחוברות אליו. הכלל שהוצג: בגרף קשיר קיים מסלול אוילר רק אם יש בדיוק 0 או 2 קודקודים בעלי דרגה אי-זוגית (0 - למעגל אוילר, 2 - למסלול פתוח)."},
{topic:"t12", q:"מדוע במסלול אוילר (שאינו מעגל) חובה להתחיל בדיוק באחד משני קודקודי הדרגה האי-זוגית, ולסיים בשני?",
 options:["מכיוון שבכל קודקוד ביניים המסלול חייב \"להיכנס ולצאת\" מספר שווה של פעמים (קשתות מזווגות בזוגות), ורק שני קודקודי הקצה (התחלה וסוף) יכולים להיוותר עם קשת בודדת לא-מזווגת - ולכן הם חייבים להיות בדיוק קודקודי הדרגה האי-זוגית", "מכיוון שדרגה אי-זוגית פירושה שאסור לעבור בקודקוד הזה בכלל", "מכיוון שזהו כלל שרירותי שאין לו הצדקה מתמטית", "מכיוון שרק בקודקוד בדרגה אי-זוגית ניתן לחזור על אותה קשת פעמיים"], correct:0,
 explain:"בכל קודקוד ביניים (לא קצה), כל כניסה למסלול מלווה ביציאה - ולכן קשתותיו מתחלקות לזוגות (דרגה זוגית). רק קודקודי ההתחלה והסוף \"נשארים\" עם קשת אחת בודדת שלא זווגה, ולכן הם חייבים להיות בדיוק שני הקודקודים בעלי הדרגה האי-זוגית."},
{topic:"t12", q:"מהו ההבדל בין מסלול אוילר למעגל אוילר?",
 options:["מסלול אוילר עובר בכל קשת בגרף בדיוק פעם אחת בין שתי נקודות שונות, בעוד מעגל אוילר עובר בכל קשת בדיוק פעם אחת וחוזר לנקודת ההתחלה; מעגל אוילר קיים רק כאשר כל הקודקודים בדרגה זוגית", "שני המונחים זהים לחלוטין ומתארים אותו דבר", "מסלול אוילר עובר בכל קודקוד פעם אחת ומעגל אוילר עובר בכל קשת פעם אחת", "מעגל אוילר קיים רק בגרפים לא-קשירים"], correct:0,
 explain:"מסלול אוילר הוא מסלול פתוח (התחלה וסוף שונים, שני קודקודים בדרגה אי-זוגית); מעגל אוילר הוא מסלול סגור החוזר לנקודת המוצא, וקיים רק כשכל הקודקודים בדרגה זוגית - כלל הדרגות המחמיר יותר."},
{topic:"t12", q:"מדוע בבעיית גשרי קניגסברג לא ניתן היה למצוא מסלול שעובר בכל גשר פעם אחת, לפי מבנה דרגות קודקודי היבשות?",
 options:["משום שבגרף שייצג את העיר היו יותר משני קודקודים בעלי דרגה אי-זוגית (כל ארבע היבשות היו בדרגה אי-זוגית), מה שסותר את התנאי הנדרש לקיום מסלול אוילר", "משום שבעיר היו יותר מדי גשרים לחישוב ידני", "משום שכל קודקודי היבשות היו בדרגה זוגית ולכן אסור היה לעבור בהם כלל", "משום שהגרף לא היה קשיר כלל"], correct:0,
 explain:"בגרף קניגסברג היו ארבעה קודקודים (יבשות) כולם בדרגה אי-זוגית - הרבה יותר משני הקודקודים המותרים לפי כלל האוילר, ולכן לא יכול היה להתקיים מסלול כזה."},
{topic:"t12", q:"כיצד קשור עקרון מסלול/מעגל אוילר לבעיית מחלק הדואר הסיני?",
 options:["בעיית מחלק הדואר הסיני מחפשת מעגל שעובר בכל קשת לפחות פעם אחת; אם קיים בגרף מעגל אוילר (כל הדרגות זוגיות) הפתרון הוא פשוט המעגל עצמו, ואחרת יש \"להכפיל\" קשתות מסוימות (בעלות המשקל הנמוך ביותר) כדי להפוך את כל הדרגות לזוגיות ואז למצוא מעגל אוילר ברשת המורחבת", "אין קשר כלשהו בין שני המושגים", "מחלק הדואר הסיני אוסר על מעבר בקשתות בדרגה זוגית", "מעגל אוילר תמיד ארוך יותר מפתרון מחלק הדואר הסיני"], correct:0,
 explain:"אם לגרף כבר יש מעגל אוילר (כל הדרגות זוגיות) - זהו בדיוק הפתרון של מחלק הדואר הסיני, ללא כפל קשתות. אם לא, יש להוסיף (לשכפל) קשתות קיימות בעלות עלות מינימלית כדי להפוך את כל הקודקודים לדרגה זוגית, ואז המעגל נמצא ברשת המורחבת."},
{topic:"t12", q:"בדוגמת \"ציור הבית הקלאסי\" (ריבוע עם X בתוכו וגג משולש), מדוע ניתן לצייר אותו במכה אחת בלי להרים את העיפרון ובלי לעבור על אותו קו פעמיים?",
 options:["משום שבגרף המייצג את קווי הציור יש בדיוק שני קודקודים בעלי דרגה אי-זוגית (הפינות התחתונות של הריבוע), מה שמקיים בדיוק את תנאי קיומו של מסלול אוילר", "משום שכל הקודקודים בציור בדרגה זוגית", "משום שיש בציור יותר משני קודקודים בדרגה אי-זוגית", "משום שהציור אינו גרף קשיר ולכן כל התחלה אפשרית"], correct:0,
 explain:"בציור הבית הקלאסי שתי הפינות התחתונות של הריבוע הן בדרגה 3 (אי-זוגית) ושאר הקודקודים בדרגה זוגית - בדיוק שני קודקודים אי-זוגיים, המקיימים את תנאי מסלול האוילר."},
{topic:"t12", q:"מדוע ניסיון להתחיל את ציור \"הבית הקלאסי\" מקודקוד בדרגה זוגית (כגון ראש הגג) נכשל בהכרח?",
 options:["משום שרק שני קודקודי הדרגה האי-זוגית יכולים לשמש כנקודות התחלה/סיום למסלול אוילר; התחלה מקודקוד זוגי תוביל תמיד למצב שבו נתקעים או נאלצים לעבור על קו פעמיים לפני סיום כל הקווים", "משום שקודקוד בדרגה זוגית אינו מחובר לאף קשת", "משום שאסור על פי ההגדרה לגעת בקודקוד בדרגה זוגית כלל", "משום שראש הגג תמיד מנותק משאר הציור"], correct:0,
 explain:"בהתאם לכלל האוילר, רק שני קודקודי הדרגה האי-זוגית יכולים לשמש כנקודות קצה תקינות. התחלה מקודקוד בדרגה זוגית תשאיר בהכרח קשת \"תלויה\" שלא ניתן לכסות מבלי לחזור על קו קיים."},

/* ===== t13: מערכות מידע גיאוגרפיות (GIS) ===== */
{topic:"t13", q:"מהם חמשת המרכיבים הבסיסיים המשולבים במערכת GIS (מערכת מידע גיאוגרפית)?",
 options:["נתונים, חומרה, תוכנה, פרוצדורות וכוח אדם", "רק נתונים ותוכנה, ללא צורך ברכיבים נוספים", "רק חומרה ורשתות תקשורת", "מפות, לוויינים, אנטנות, שרתים ומסכים בלבד"], correct:0,
 explain:"החומר מפרט חמישה מרכיבים בסיסיים ל-GIS: נתונים (ממקורות שונים), חומרה, תוכנה, פרוצדורות (תוספות פונקציונליות) וכוח אדם המפעיל ומנתח את המערכת."},
{topic:"t13", q:"מה ההבדל המהותי בין פורמט נתונים \"ראסטר\" ל\"וקטורי\" בייצוג מידע גיאוגרפי?",
 options:["ראסטר מבוסס על חלוקת התמונה לתאים (פיקסלים) ברזולוציה קבועה שקשה לשנות, בעוד וקטורי מבוסס על קואורדינטות מתמטיות המאפשרות חישובים, עריכה דינמית והתאמת רמת פירוט", "ראסטר וקטורי הם שני שמות לאותה שיטת אחסון בדיוק", "וקטורי מתאים רק לתצלומי אוויר וראסטר מתאים רק לכבישים", "ראסטר הוא תמיד מדויק יותר מוקטורי בכל שימוש"], correct:0,
 explain:"פורמט ראסטר (תאים/פיקסלים) מתאים לתצלומי אוויר וסרוקים אך קבוע ברמת הפירוט; פורמט וקטורי (קואורדינטות X,Y) דינמי ומאפשר מניפולציות וחישובים - זהו ההבדל המרכזי שהוצג."},
{topic:"t13", q:"מהם שלושת סוגי האובייקטים הבסיסיים בייצוג וקטורי, ולמה כל אחד מהם משמש?",
 options:["נקודה (לעצמים בודדים כמו עמודי תאורה ואנטנות), קו (לעצמים אורכיים כמו כבישים וצינורות), ופוליגון (לשטחים סגורים כמו מגרשים ומבנים)", "נקודה, עיגול ומשולש בלבד", "רק שני סוגים: תמונה ווידאו", "קו, מטריצה ווקטור מתמטי בלבד"], correct:0,
 explain:"החומר מפרט שלוש ישויות וקטוריות בסיסיות: נקודה (Point) לעצמים בודדים, קו (Line) לעצמים אורכיים כמו כבישים ונהרות, ופוליגון (Polygon) לשטחים סגורים כמו מגרשים ויערות."},
{topic:"t13", q:"מהי \"גיאורפרנסינג\" (עיגון תמונה) ומדוע היא נחוצה בשילוב תצלומי אוויר במערכת GIS?",
 options:["תהליך התאמת תצלום אוויר/לוויין (שלא בהכרח צולם בזווית התואמת את המערכת) למערכת הקואורדינטות של המפה, באמצעות סיבוב, הגדלה והתאמת קנה מידה", "תהליך מחיקת כל הנתונים הווקטוריים מהמערכת", "תהליך שמבוצע רק על מפות ולא על תצלומי לוויין", "תהליך שאינו קשור כלל למיקום גיאוגרפי"], correct:0,
 explain:"כאשר תמונה (תצלום אוויר/לוויין) אינה תואמת מלכתחילה את זווית או קנה המידה של המערכת, מבוצע תהליך \"עיגון\" (גיאורפרנסינג) - סיבוב, הגדלה והתאמה - כדי לשלב אותה נכון עם המידע הווקטורי הקיים."},
{topic:"t13", q:"מה ההבדל בין \"תשאול\" (Query) ל\"ניתוח\" (Analysis) כשני סוגי הפעולות העיקריים במערכת GIS?",
 options:["תשאול הוא שליפת נתונים קיימים לפי תנאי נתון (למשל \"הצג מחוזות עם מעל 300 אלף תושבים\"), בעוד ניתוח כולל הפעלת אלגוריתמים וכלים חישוביים על הנתונים (כגון חישוב מסלול קצר ביותר)", "תשאול וניתוח הם אותו הדבר בדיוק במערכת GIS", "תשאול הוא תמיד יקר ואיטי יותר מניתוח", "ניתוח משמש רק להצגת טבלאות ולא לחישובים"], correct:0,
 explain:"תשאול (Query) הוא שליפת מידע קיים לפי תנאים (מסנן פשוט), בעוד ניתוח (Analysis) כולל הפעלת כלים חישוביים ואלגוריתמים - כמו חישוב מסלול קצר ביותר עבור אמבולנס."},
{topic:"t13", q:"מהי שיטת ה-Overlay (חפיפת שכבות) בניתוח GIS, ומהו יתרונה המרכזי?",
 options:["שיטה שבה מפרקים את המציאות לשכבות נפרדות (כל שכבה עוסקת בנושא אחר) ומאפשרת שילוב מידע ממספר שכבות בו-זמנית - למשל איתור בארות מסוג מסוים בקרקע חולית בתוך מבנה מסוים", "שיטה שמוחקת שכבות מיותרות מהמערכת לצמיתות", "שיטה המיועדת אך ורק להצגת תמונות ראסטר", "שיטה שמאפשרת רק שכבה אחת בכל פעם ללא שילוב"], correct:0,
 explain:"עקרון ה-Overlay: פירוק המציאות לשכבות נושאיות נפרדות (למשל שכבת לקוחות, שכבת צמחייה, שכבת בניינים) המאפשרות שאילתות המשלבות תנאים ממספר שכבות בו-זמנית."},
{topic:"t13", q:"מהי \"Linear Referencing\" (מיקום ליניארי) במערכות GIS, ולמה היא משמשת?",
 options:["שיטה למיקום נקודות תפעוליות (כגון מיקומי תאונות או תקלות תשתית) לאורך קו (כביש) בעזרת מרחק מנקודת ייחוס, ולא רק בעזרת קואורדינטות מוחלטות", "שיטה לחישוב זרימת תנועה מקסימלית בלבד", "שיטה המשמשת רק להצגת פוליגונים", "שיטה שמבטלת את הצורך במיקום נקודות תפעוליות"], correct:0,
 explain:"Linear Referencing מאפשרת למקם נקודות תפעוליות (תאונות, תקלות, נקודות בעייתיות) לאורך קו קיים (כמו כביש) ביחס למרחק מתחילתו, שימושי במיוחד עבור נתונים שקשורים לרשת קווית."},
{topic:"t13", q:"מדוע נדרש שילוב מערכת GIS עם מערכות מידע ארגוניות קיימות (כגון SAP)?",
 options:["כדי למנוע ניהול כפול של אותו מידע בשתי מערכות נפרדות, ולאפשר גישה משולבת לנתונים תפעוליים/עסקיים לצד הנתונים הגיאוגרפיים", "כי GIS אינו יכול לתפקד כלל ללא מערכת SAP", "כדי לבטל את הצורך בכל נתון גיאוגרפי", "כי SAP הוא סוג של פורמט ראסטר בלבד"], correct:0,
 explain:"החומר מדגיש שאין רצון \"לנהל פעמיים בשתי מערכות שונות\" - ולכן שילוב GIS עם מערכות ארגוניות קיימות (כמו SAP) מייעל את הגישה למידע ומונע כפילות וניהול נפרד."},
{topic:"t13", q:"מהו יתרונם המרכזי של \"ניתוחי רשת\" (Network Analysis) במערכת GIS עבור שירותי חירום, כגון שליחת אמבולנס?",
 options:["הם מתרגמים את רשת הכבישים למודל מתמטי של צמתים וקשתות, המאפשר לאלגוריתמי ניווט לחשב מסלול קצר ביותר תוך התחשבות באילוצים ריאליים כמו גובה גשרים או משקל מותר", "הם מציגים רק תצלומי אוויר ללא נתוני מרחק", "הם משמשים אך ורק לחישוב עלויות שינוע ולא למסלולים", "הם מבטלים את הצורך בחישוב מסלול קצר ביותר"], correct:0,
 explain:"ניתוחי רשת ב-GIS מתרגמים את מפת הכבישים למודל של צמתים וקשתות (בדיוק כפי שנעשה באלגוריתם דייקסטרה), ומאפשרים חישוב מסלול אופטימלי תוך שילוב אילוצים אמיתיים כמו מגבלות גובה ומשקל."},
{topic:"t13", q:"מדוע נחשב פורמט וקטורי ל\"דינמי\" יותר מפורמט ראסטר בהצגת מפות בקני מידה שונים (זום אין/אאוט)?",
 options:["משום שהוא מבוסס על מספרים (קואורדינטות) הניתנים לחישוב מחדש בכל רמת זום, כך שניתן להציג יותר או פחות פירוט לפי הצורך, בעוד תמונת ראסטר קבועה ומאבדת איכות בהגדלה", "משום שוקטורי הוא תמיד קובץ קטן יותר בגודלו מראסטר", "משום שראסטר אינו יכול להיות מוצג במחשב כלל", "אין הבדל בין השניים בהקשר זה"], correct:0,
 explain:"במפה בקנה מידה משתנה, יישובים מיוצגים כנקודות שגודלן משתנה לפי הזום, ופוליגונים מתעדנים ככל שמתקרבים - זה אפשרי כי המידע הווקטורי מספרי וניתן לחישוב מחדש, בשונה מתמונת ראסטר קבועה."},

/* ===== t14: טכנולוגיות מיקום ו-GPS ===== */
{topic:"t14", q:"כמה לוויינים נדרשים לפחות כדי לקבוע מיקום דו-ממדי לעומת תלת-ממדי (כולל גובה) בטריאנגולציה של GPS?",
 options:["שלושה לוויינים מספיקים לקביעת מיקום דו-ממדי (חיתוך רדיוסים), ונדרש לוויין רביעי לצורך קביעת גובה מדויק", "לוויין בודד מספיק תמיד לקביעת מיקום מלא כולל גובה", "נדרשים לפחות עשרה לוויינים לכל חישוב מיקום", "אין קשר בין מספר הלוויינים לדיוק חישוב המיקום"], correct:0,
 explain:"בטריאנגולציה, כל לוויין מגדיר רדיוס מרחק מהמכשיר; חיתוך שלושה רדיוסים כאלה קובע נקודה דו-ממדית, ולוויין רביעי דרוש כדי להוסיף את מימד הגובה."},
{topic:"t14", q:"מהו העיקרון שמאפשר למקלט GPS לחשב את מרחקו מכל לוויין?",
 options:["כל לוויין נושא שעון אטומי מדויק ומשדר אות הכולל את השעה המדויקת ואת מיקומו; המקלט משווה בין שעת השידור לשעת הקבלה ומחשב את המרחק על סמך זמן הגעת האות", "הלוויין שולח למקלט ישירות את המרחק המחושב מראש", "המרחק מחושב אך ורק לפי עוצמת האות ללא קשר לזמן", "אין צורך בשעון מדויק בלוויין כלל"], correct:0,
 explain:"כל לוויין נושא שעון אטומי ומשדר אות הכולל שעה ומיקום; המקלט מודד את זמן ההגעה של האות (בהשוואה לשעונו) ומתרגם זאת למרחק מהלוויין - עיקרון בסיס לטריאנגולציה."},
{topic:"t14", q:"מהו העיקרון שבבסיס A-GPS (Assisted GPS) ומדוע הוא מאיץ את זמן \"הנעילה\" על מיקום בטלפון סלולרי?",
 options:["במקום להוריד את נתוני מיקומי הלוויינים ישירות מהלוויינים (תהליך איטי כשהאות חלש), המכשיר מוריד מידע דומה משרת אינטרנט מתעדכן, מה שמזרז משמעותית את תהליך זיהוי המיקום הראשוני", "A-GPS מבטל לחלוטין את הצורך בלוויינים כלל", "A-GPS מאט את התהליך אך משפר את הדיוק בלבד", "A-GPS פועל רק כאשר אין קליטת אינטרנט כלל"], correct:0,
 explain:"A-GPS מוריד את נתוני מיקומי הלוויינים משרת אינטרנט (שכל הזמן מתעדכן מול הלוויינים) במקום ישירות מהלוויין - חוסך זמן הורדה איטי במיוחד כשהאות חלש, ומאפשר נעילה מהירה על מיקום."},
{topic:"t14", q:"מדוע GPS רגיל אינו יעיל לרוב לצורך מיקום בתוך מבנים (Indoor Positioning)?",
 options:["אותות הלוויינים מוחלשים משמעותית על ידי קירות ומבנים (בייחוד ממ\"ד עם ברזל ובטון), ולכן משתמשים בחלופות כמו Wi-Fi, Bluetooth וחיישני סמארטפון", "GPS עובד טוב יותר בתוך מבנים מאשר בשטח פתוח", "אין שום הבדל בין קליטת GPS בתוך מבנה לבין קליטתו בשטח פתוח", "GPS אסור לשימוש בתוך מבנים מטעמי חוק"], correct:0,
 explain:"אותות GPS חלשים דיים כך שקירות ומבנים (בעיקר ממ\"דים עם זיון ברזל) חוסמים אותם, ולכן לצרכי מיקום פנים-מבני נדרשות טכנולוגיות חלופיות כמו Wi-Fi ו-Bluetooth."},
{topic:"t14", q:"אילו שתי טכנולוגיות אלחוטיות עיקריות משמשות למיקום בתוך מבנים כתחליף ל-GPS, ובמה הן נבדלות בהקשר צריכת אנרגיה?",
 options:["Wi-Fi (מיפוי עוצמת אותות מנקודות גישה ידועות) ו-Bluetooth (שימוש ב-Beacons ומכשירים קרובים); Bluetooth צורך פחות אנרגיה מ-Wi-Fi", "רדיו AM ו-FM, שתיהן זהות לחלוטין בצריכת האנרגיה", "רק GPS משופר, ללא צורך בטכנולוגיה נוספת", "לוויינים בלבד, עם צריכת אנרגיה זהה לחלוטין ל-Wi-Fi"], correct:0,
 explain:"החומר מציין ש-Wi-Fi ממפה עוצמת אותות מנקודות גישה ידועות, ו-Bluetooth משתמש ב-Beacons ובמכשירים קרובים; יתרון ה-Bluetooth המצוין הוא צריכת אנרגיה נמוכה יותר מ-Wi-Fi."},
{topic:"t14", q:"מהו תפקידה של מערכת AVL (Automatic Vehicle Location) בניהול צי רכבים?",
 options:["קופסה המותקנת ברכב וקולטת את נתוני מיקום ה-GPS שלו ומעבירה אותם למוקד החברה, המאפשרת מעקב שוטף אחר מיקום כלי הרכב על מפה וניהולם בזמן אמת", "מערכת המונעת לחלוטין את השימוש ב-GPS ברכב", "כלי המשמש רק לחישוב עלות דלק ולא למיקום", "מערכת המאפשרת רק תקשורת קולית עם הנהג ולא איתור מיקום"], correct:0,
 explain:"AVL היא קופסה המתחברת לרכב, קולטת את נתוני ה-GPS שלו ומעבירה אותם למוקד החברה - כך ניתן לדעת את מיקום כל כלי הרכב בצי בזמן אמת ולנהלו על גבי מפה."},
{topic:"t14", q:"מהו \"שילוח דינמי\" (Dynamic Dispatch), וכיצד טכנולוגיית איכון בזמן אמת (כגון AVL) מאפשרת אותו?",
 options:["שיבוץ משימה (כגון קריאת חירום) לרכב הפנוי והקרוב ביותר בזמן אמת, המבוסס על ידיעת המיקום העדכני של כל כלי הרכב בצי דרך מערכת האיכון", "שיבוץ קבוע מראש של כל משימה לרכב מסוים ללא אפשרות שינוי", "שיטת ניתוב שאינה תלויה כלל במיקום כלי הרכב", "תהליך שמבוצע רק פעם אחת ביום עבור כל הרכבים יחד"], correct:0,
 explain:"בעזרת נתוני מיקום עדכניים (למשל מ-AVL), ניתן לבדוק מי מכלי הרכב פנוי וקרוב ביותר לאירוע נתון (כמו קריאת אמבולנס) ולשלוח אותו באופן דינמי, בניגוד לשיבוץ קבוע מראש."},
{topic:"t14", q:"מהי המגבלה המרכזית של GPS \"קלאסי\" (שאינו A-GPS) בזמן הפעלה ראשונית, ומהי הסיבה לה?",
 options:["עליו לטעון את כל נתוני מיקומי הלוויינים ישירות מהם לפני שהוא מתחיל לפעול, תהליך שיכול לקחת זמן רב יחסית ומקשה על \"נעילה\" מהירה במיוחד כשהאות חלש", "אין לו כל מגבלה, והוא תמיד מהיר יותר מ-A-GPS", "המגבלה היחידה שלו היא עלות כספית גבוהה בלבד", "הוא אינו יכול לפעול בכלל ללא חיבור לאינטרנט"], correct:0,
 explain:"GPS קלאסי טוען את כל הנתונים הנדרשים ישירות מהלוויינים לפני תחילת הפעולה - תהליך איטי יחסית, ובמיוחד כשהאות חלש. זו בדיוק הבעיה ש-A-GPS פותר על ידי הורדת המידע משרת אינטרנט."},

/* ===== תוספות לנושאים קיימים ===== */
{topic:"t7", q:"מדוע חישוב מרחק לפי \"קו אווירי\" (אוקלידי) נוטה להעריך בחסר את המרחק האמיתי ברשת הכבישים, בעוד חלוקה למקטעים נפרדים לפי ציר X ולאחר מכן ציר Y (מרחק Rectilinear) נוטה להעריך ביתר?",
 options:["מרחק קו אווירי הוא הקו הישר הקצר ביותר בין שתי נקודות ולכן קטן או שווה למרחק בפועל ברשת (הערכת-חסר שמרנית), ואילו נסיעה נפרדת על כל ציר בתורו יוצרת מסלול ארוך יותר מהמינימלי ולכן מספקת הערכת-יתר שמרנית, שימושית כשרוצים לוודא שלא חורגים ממגבלת מרחק", "שתי השיטות נותנות תמיד בדיוק את אותה תוצאה", "קו אווירי תמיד מעריך ביתר ו-Rectilinear תמיד מעריך בחסר - הפוך ממה שנטען", "אף אחת מהשיטות אינה קשורה למרחק בפועל ברשת"], correct:0,
 explain:"קו אווירי הוא המרחק הקצר ביותר האפשרי מתמטית בין שתי נקודות, ולכן תמיד ≤ מהמרחק ברשת בפועל (הערכת חסר). לעומת זאת נסיעה על ציר X ואז על ציר Y (כמו ברשת מנהטן) יוצרת מסלול שאינו הקצר ביותר האפשרי, ולכן משמש כהערכה שמרנית (מחמירה) שסביר שלא תפחית ממנה במציאות."},
{topic:"t11", q:"מדוע הוספת לקוח בודד אחד לבעיית הסוכן הנוסע מגדילה את מרחב הפתרונות האפשריים ב\"התפוצצות קומבינטורית\" ולא בתוספת קבועה?",
 options:["מספר הסדרים האפשריים לביקור ב-n קודקודים גדל כמו n! (עצרת), כך שמעבר מ-n ל-n+1 קודקודים מכפיל את מרחב האפשרויות פי (n+1) - קצב גדילה חד בהרבה מגידול ליניארי או אפילו אקספוננציאלי רגיל", "הוספת לקוח תמיד מוסיפה בדיוק פתרון אפשרי אחד נוסף בלבד", "מרחב הפתרונות אינו תלוי כלל במספר הלקוחות", "מרחב הפתרונות גדל בקצב ליניארי קבוע עם כל לקוח נוסף"], correct:0,
 explain:"מספר הסדרים האפשריים לביקור בקודקודים הוא n! (עצרת). המעבר בין n=100 ל-n=101 הוא הכפלה פי 101 במרחב האפשרויות (101!=101×100!) - קצב גדילה חד יותר אפילו מגידול אקספוננציאלי רגיל, ומכאן ה\"התפוצצות הקומבינטורית\"."},
{topic:"t11", q:"מהי גישת ה\"כוח הגס\" (Brute Force) לפתרון בעיית הסוכן הנוסע, ומדוע היא אינה מעשית עבור מספר קודקודים גדול?",
 options:["הפקת כל המסלולים האפשריים, חישוב האורך של כל אחד מהם ובחירת הקצר ביותר; בשל הגידול הפקטוריאלי במספר האפשרויות, השיטה הופכת לבלתי מעשית חישובית כבר עבור מספר בינוני של קודקודים", "בחירה אקראית של מסלול יחיד ללא כל בדיקה נוספת", "שימוש באלגוריתם דייקסטרה בלבד לפתרון TSP", "התעלמות מוחלטת ממשקלי הקשתות בגרף"], correct:0,

{topic:"t11", q:"מדוע רשת עם כבישים דו-סטריים (שבהם ההלוך שונה מהחזור) נחשבת מורכבת יותר לפתרון VRP מרשת עם כבישים חד-סטריים בלבד?",
 options:["כביש דו-סטרי מחייב להתייחס לשני הכיוונים כאל שני מסלולים אפשריים נפרדים (הלוך והחזור עשויים להיות שונים בעלות/זמן/זמינות), מה שלמעשה מכפיל את גודל מרחב האפשרויות שיש לשקול, בעוד רשת חד-סטרית מצמצמת ומגבילה אותו", "כביש דו-סטרי תמיד קצר יותר מכביש חד-סטרי", "אין הבדל תפעולי כלשהו בין רשת חד-סטרית לדו-סטרית", "רשת חד-סטרית תמיד קשה יותר לפתרון מרשת דו-סטרית"], correct:0,
 explain:"בכביש דו-סטרי, ההלוך והחזור עשויים להיחשב כשני \"מסלולים\" נפרדים בעלי מאפיינים שונים - מה שמגדיל את מרחב האפשרויות שהאלגוריתם צריך לשקול, בהשוואה לרשת המוגבלת מראש של כבישים חד-סטריים בלבד."},
{topic:"t11", q:"במה שונה VRP \"דינמי\" (שבו הזמנות נכנסות תוך כדי הנסיעה, כגון הזמנות משלוח פיצה) מ-VRP סטטי מבחינת יכולת התכנון מראש?",

const GLOSSARY = [

 {term:"אינטרמודליות (Intermodality)", def:"שילוב של מספר אמצעי תובלה שונים (למשל משאית-רכבת-אנייה) בהעברת אותה יחידת מטען לאורך שרשרת ההובלה."},
 {term:"Composition / Decomposition", def:"Composition - איחוד זרימות ממקורות מבוזרים ל\"First Mile\"; Decomposition - פיצול זרימה גדולה ליעדים מבוזרים ב\"Last Mile\"."},
 {term:"Last Mile", def:"שלב ההפצה הסופי מהמסוף האזורי האחרון אל הלקוח הבודד; מאופיין לרוב בעלות גבוהה יחסית ליחידת מטען."},
 {term:"Truckload (TL)", def:"משלוח בודד גדול התופס משאית שלמה."},
 {term:"Less than Truckload (LTL)", def:"שילוב מספר משלוחים קטנים של לקוחות שונים באותה משאית."},
 {term:"RoRo (Roll-on/Roll-off)", def:"שיטת הובלה ימית שבה כלי רכב או ציוד גלגלי נוסע ישירות אל תוך כלי השיט וממנו, ללא צורך במנוף."},

 {term:"בעיית תובלה (Transportation Problem)", def:"בהינתן ספקים ולקוחות בעלי היצע וביקוש ידועים, יש לספק את הביקוש בעלות הובלה כוללת מינימלית; דורשת איזון בין סך ההיצע לסך הביקוש (באמצעות ספק/לקוח פיקטיבי במידת הצורך)."},

 {term:"מסלול אוגמנטי", def:"מסלול מקודקוד המקור לקודקוד היעד בעל זרימה שיורית חיובית לאורכו, המשמש בכל איטרציה של אלגוריתם פורד-פלקרסון להוספת זרימה."},

 {term:"בעיית מיקום מתקנים (Facility Location Problem)", def:"מציאת מיקום אופטימלי למתקן או למתקנים לפי קריטריון נתון (עלות, זמן, כיסוי); כוללת שלבים של תכנון אסטרטגי, עיצוב רשת, סינון אתרים, בדיקת שטח וניתוח כספי, ומשא ומתן."},

 {term:"Min-Max (מיקום מתקנים)", def:"מיקום מתקנים כך שהמרחק/זמן המקסימלי ללקוח הרחוק ביותר יהיה מינימלי - מבטיח רמת שירות מינימלית לכל לקוח."},
 {term:"כיסוי מקסימלי (Maximal Coverage)", def:"מיקום מספר מוגבל של מתקנים כך שהביקוש המכוסה בטווח שירות נתון יהיה הגדול ביותר האפשרי, גם אם לא כל הלקוחות מכוסים."},
