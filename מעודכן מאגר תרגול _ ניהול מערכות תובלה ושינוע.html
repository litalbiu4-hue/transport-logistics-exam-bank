<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מאגר תרגול | ניהול מערכות תובלה ושינוע</title>
<style>
  :root{
    --navy:#0f1b2d;
    --navy2:#16263f;
    --panel:#ffffff;
    --bg:#eef1f5;
    --ink:#1a2233;
    --muted:#5b6579;
    --line:#dbe1ea;
    --amber:#e2a63a;
    --teal:#1a8f86;
    --red:#c0432f;
    --green:#1f8a4c;
    --radius:14px;
    --shadow:0 2px 10px rgba(15,27,45,.08), 0 10px 30px rgba(15,27,45,.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Segoe UI","Arial Hebrew","Noto Sans Hebrew",Arial,sans-serif;
    line-height:1.55;
    min-height:100vh;
  }
  .topbar{
    background:linear-gradient(135deg,var(--navy) 0%, var(--navy2) 100%);
    color:#eef3f8;
    padding:16px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    position:sticky;
    top:0;
    z-index:50;
    box-shadow:0 2px 14px rgba(0,0,0,.18);
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .mark{
    width:38px;height:38px;border-radius:10px;
    background:linear-gradient(135deg,var(--amber),#c9832a);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;color:#241505;font-size:18px;
    flex:0 0 auto;
  }
  .brand h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.2px;}
  .brand p{margin:0;font-size:11.5px;color:#b9c6da;}
  .topbar .actions{display:flex;gap:8px;flex-wrap:wrap;}
  .btn{
    appearance:none;border:1px solid var(--line);background:var(--panel);
    color:var(--ink);padding:9px 14px;border-radius:10px;cursor:pointer;
    font-size:13.5px;font-weight:600;transition:.15s;
    display:inline-flex;align-items:center;gap:6px;
  }
  .btn:hover{transform:translateY(-1px);box-shadow:var(--shadow);}
  .btn.ghost{background:rgba(255,255,255,.08);color:#eef3f8;border-color:rgba(255,255,255,.25);}
  .btn.ghost:hover{background:rgba(255,255,255,.16);}
  .btn.primary{background:var(--amber);border-color:var(--amber);color:#241505;}
  .btn.primary:hover{background:#d69a30;}
  .btn.teal{background:var(--teal);border-color:var(--teal);color:#fff;}
  .btn.teal:hover{background:#157f77;}
  .btn.danger{background:#fff;color:var(--red);border-color:#f0c3ba;}
  .btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none;}

  .wrap{max-width:980px;margin:0 auto;padding:26px 18px 60px;}
  .hero{
    background:linear-gradient(135deg,var(--navy),#1c3355);
    color:#eef3f8;border-radius:18px;padding:26px 24px;margin-bottom:22px;
    box-shadow:var(--shadow);
    position:relative;overflow:hidden;
  }
  .hero:before{
    content:"";position:absolute;inset:0;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 2px, transparent 2px 46px);
    opacity:.6;
  }
  .hero h2{margin:0 0 6px;font-size:22px;position:relative;}
  .hero p{margin:0;color:#c3d0e3;font-size:13.5px;position:relative;max-width:640px;}
  .stats-row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;position:relative;}
  .stat-chip{
    background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);
    border-radius:10px;padding:8px 12px;font-size:12.5px;color:#dce6f2;
  }
  .stat-chip b{color:#fff;font-size:14px;display:block;}

  .section-title{font-size:15px;font-weight:800;margin:26px 0 12px;color:var(--navy);display:flex;align-items:center;gap:8px;}
  .section-title .dot{width:8px;height:8px;border-radius:50%;background:var(--amber);}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 16px 14px;cursor:pointer;transition:.15s;position:relative;overflow:hidden;
  }
  .card:hover{box-shadow:var(--shadow);transform:translateY(-2px);border-color:#c7d2e0;}
  .card .num{
    position:absolute;top:0;left:0;background:var(--navy);color:#fff;
    font-size:11px;font-weight:800;padding:4px 10px;border-radius:0 0 10px 0;
  }
  .card h3{margin:6px 0 6px;font-size:14.5px;color:var(--ink);padding-right:2px;}
  .card .meta{font-size:12px;color:var(--muted);}

  .exam-card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px;display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:12px;
    box-shadow:var(--shadow);
  }
  .exam-card .info h3{margin:0 0 4px;font-size:15.5px;}
  .exam-card .info p{margin:0;font-size:12.5px;color:var(--muted);}
  .badge{display:inline-block;background:#fbeed6;color:#8a5a12;border-radius:20px;padding:2px 10px;font-size:11px;font-weight:700;margin-inline-end:6px;}
  .badge.teal{background:#dcf3f1;color:#0f6a63;}

  .print-panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);}
  .topic-checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin:14px 0;}
  .topic-checks label{display:flex;align-items:center;gap:8px;font-size:13px;background:#f6f8fb;border:1px solid var(--line);border-radius:9px;padding:8px 10px;cursor:pointer;}

  /* Quiz view */
  .quiz-shell{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
  .quiz-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);background:#f7f9fc;flex-wrap:wrap;gap:8px;}
  .quiz-head .prog{font-size:12.5px;color:var(--muted);font-weight:700;}
  .timer{
    font-variant-numeric:tabular-nums;font-weight:800;font-size:15px;color:var(--navy);
    background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px 12px;
  }
  .timer.low{color:var(--red);border-color:#f0c3ba;background:#fff4f2;}
  .progressbar{height:5px;background:#e6ebf2;}
  .progressbar > div{height:100%;background:linear-gradient(90deg,var(--amber),var(--teal));transition:width .25s;}
  .qbody{padding:22px;}
  .qtopic{font-size:11.5px;color:var(--teal);font-weight:800;margin-bottom:8px;}
  .qtext{font-size:16.5px;font-weight:700;color:var(--ink);margin:0 0 18px;line-height:1.6;}
  .opt{
    display:flex;align-items:flex-start;gap:10px;
    border:1.5px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:10px;
    cursor:pointer;transition:.12s;font-size:14px;background:#fff;
  }
  .opt:hover{border-color:#b9c6da;background:#f8fafc;}
  .opt .let{
    flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:#eef1f5;
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--muted);
  }
  .opt.selected{border-color:var(--navy);background:#eef3fb;}
  .opt.selected .let{background:var(--navy);color:#fff;}
  .opt.correct{border-color:var(--green);background:#eaf7ee;}
  .opt.correct .let{background:var(--green);color:#fff;}
  .opt.wrong{border-color:var(--red);background:#fdeeec;}
  .opt.wrong .let{background:var(--red);color:#fff;}
  .opt.disabled{cursor:default;}
  .qfoot{display:flex;justify-content:space-between;align-items:center;padding:14px 22px 20px;gap:10px;flex-wrap:wrap;}

  .result-wrap{padding:34px 22px;text-align:center;}
  .score-ring{
    width:150px;height:150px;border-radius:50%;margin:0 auto 16px;
    display:flex;align-items:center;justify-content:center;flex-direction:column;
    background:conic-gradient(var(--teal) calc(var(--pct)*1%), #e6ebf2 0);
    position:relative;
  }
  .score-ring:before{content:"";position:absolute;inset:10px;border-radius:50%;background:#fff;}
  .score-ring .num{position:relative;font-size:30px;font-weight:900;color:var(--navy);}
  .score-ring .lbl{position:relative;font-size:11px;color:var(--muted);font-weight:700;}
  .result-wrap h2{margin:6px 0 4px;font-size:19px;}
  .result-wrap p{color:var(--muted);font-size:13.5px;margin:0 0 20px;}
  .result-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:22px;}
  .review-item{text-align:right;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;background:#fbfcfe;}
  .review-item .qi{font-weight:700;font-size:14px;margin-bottom:8px;}
  .review-item .rowline{font-size:13px;margin:3px 0;padding:4px 8px;border-radius:6px;}
  .review-item .rowline.rc{background:#eaf7ee;color:#1f6b3a;}
  .review-item .rowline.rw{background:#fdeeec;color:#a3382a;}
  .review-item .tag{display:inline-block;font-size:10.5px;color:var(--teal);font-weight:800;margin-bottom:6px;}

  .back-row{margin-bottom:14px;}
  footer.note{max-width:980px;margin:0 auto;padding:0 18px 40px;color:var(--muted);font-size:11.5px;text-align:center;}

  /* Print view */
  #printArea{display:none;}
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{display:block !important;position:absolute;top:0;right:0;left:0;padding:0 10mm;}
    .no-print{display:none !important;}
    .p-topic-title{font-size:16px;font-weight:900;margin:22px 0 10px;border-bottom:2px solid #000;padding-bottom:4px;page-break-after:avoid;}
    .p-q{margin-bottom:12px;break-inside:avoid;font-size:12.5px;}
    .p-q .p-qt{font-weight:700;margin-bottom:4px;}
    .p-q ol{margin:0;padding-inline-start:20px;}
    .p-q li{margin-bottom:2px;}
    .p-q li.correctA{font-weight:800;text-decoration:underline;}
    .p-head{font-size:20px;font-weight:900;margin-bottom:2px;}
    .p-sub{font-size:11px;color:#444;margin-bottom:14px;}
  }

  .explain-box{
    margin-top:6px;padding:13px 15px;border-radius:11px;font-size:13.5px;line-height:1.65;
    background:#f1f6fb;border:1px solid #d4e2f0;color:#233450;
  }
  .explain-box b{color:var(--navy);}
  .explain-box .fix{color:var(--green);font-weight:800;margin-bottom:4px;display:block;}

  .glossary-search{
    width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--line);
    font-size:14px;margin-bottom:14px;font-family:inherit;
  }
  .gloss-item{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px 16px;margin-bottom:9px;}
  .gloss-item .gterm{font-weight:800;color:var(--navy);font-size:14.5px;margin-bottom:4px;}
  .gloss-item .gdef{font-size:13.5px;color:var(--muted);line-height:1.6;}
  .gloss-empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:13.5px;}

  .review-item .rowline.explainr{background:#f1f6fb;color:#233450;border:1px solid #d4e2f0;margin-top:6px;line-height:1.6;}

  @media (max-width:640px){
    .topbar{padding:12px 14px;}
    .brand h1{font-size:14px;}
    .wrap{padding:18px 12px 50px;}
    .hero{padding:20px 16px;}
    .exam-card{flex-direction:column;align-items:stretch;text-align:center;}
  }
</style>
</head>
<body>

<div class="topbar no-print">
  <div class="brand">
    <div class="mark">נת</div>
    <div>
      <h1>מאגר תרגול – ניהול מערכות תובלה ושינוע</h1>
      <p>132 שאלות | 14 נושאים | מבחני דמה</p>
    </div>
  </div>
  <div class="actions">
    <button class="btn ghost" onclick="openGlossary()">📖 מילון מושגים</button>
    <button class="btn ghost" onclick="goHome()">🏠 תפריט ראשי</button>
  </div>
</div>

<div class="wrap no-print" id="app"></div>

<footer class="note no-print">מאגר תרגול פנימי לצורכי לימוד בקורס ניהול מערכות תובלה ושינוע. הסידור וסדר המסיחים מעורבבים בכל פתיחה מחדש.</footer>

<div id="printArea"></div>

<script>
/* ================= נתוני נושאים ================= */
const TOPICS = [
  {key:"t1", title:"מבוא – חשיבות ותחומי התחבורה"},
  {key:"t2", title:"אמצעי תחבורה, אינטרמודליות ומרכיבי התנועה"},
  {key:"t3", title:"זרימת תנועה – מושגים ומודלים"},
  {key:"t4", title:"בעיית תובלה (Transportation Problem)"},
  {key:"t5", title:"זרימה מקסימלית וחתך מינימלי"},
  {key:"t6", title:"בעיית שיטעון (Transshipment)"},
  {key:"t7", title:"מיקום מתקנים – סוגים ותהליך בחירה"},
  {key:"t8", title:"מודלים למיקום מתקן ופונקציות מטרה"},
  {key:"t9", title:"לוגיסטיקה עירונית והשפעות מיקום"},
  {key:"t10", title:"מסלול קצר ואלגוריתם דייקסטרה"},
  {key:"t11", title:"TSP, מחלק הדואר הסיני ו-VRP"},
  {key:"t12", title:"מסלולי ומעגלי אוילר (גשרי קניגסברג)"},
  {key:"t13", title:"מערכות מידע גיאוגרפיות (GIS)"},
  {key:"t14", title:"טכנולוגיות מיקום ו-GPS"}
];
const TOPIC_TITLE = Object.fromEntries(TOPICS.map(t=>[t.key,t.title]));
TOPIC_TITLE["ALL"] = "כל השאלות (תרגול מלא ברצף)";

// מאגר שאלות - ניהול מערכות תובלה ושינוע (עם הסברים)
// כל שאלה: {id, topic, q, options:[4], correct: index, explain: "..."}
const QUESTIONS = [

/* ===== t1: מבוא – חשיבות ותחומי התחבורה ===== */
{topic:"t1", q:"מהי הסיבה המרכזית לכך ששרשרת אספקה גלובלית מגבירה את התלות במערכות תובלה יעילות?",
 options:["פיזור שלבי הייצור, ההרכבה וההפצה בין מיקומים שונים מחייב תנועה מתואמת של חומרים ומוצרים ביניהם","גלובליזציה מייתרת את הצורך בהובלה כי כל מדינה מסתמכת על ייצור מקומי בלבד","יתרון לגודל מבוטל כאשר קיימת שרשרת אספקה גלובלית","התמחות מקומית מפחיתה את מספר הצמתים בשרשרת ולכן מצמצמת את הצורך בתחבורה"], correct:0,
 explain:"החומר מציג את הגלובליזציה, יתרון לגודל, ההתמחות ושרשרת האספקה כגורמים המגבירים את חשיבות התחבורה. כשכל שלב בייצור מתבצע במקום שונה, נדרשת הובלה יעילה כדי לחבר בין השלבים - ולכן ככל ששרשרת האספקה מפוזרת יותר, התלות בתחבורה גדלה, לא קטנה."},
{topic:"t1", q:"במה נבדל \"מרכז הפצה\" ממחסן רגיל, לפי החומר?",
 options:["מרכז הפצה משמש לאחסון ארוך טווח בלבד ומחסן מבצע פעולות משלימות","אין הבדל מהותי, מדובר במונחים זהים","מרכז הפצה מבצע גם פעולות משלימות (איחוד, אריזה, \"יצור\") ולא רק אחסון, בעוד מחסן משמש לאחסון בלבד","מחסן משמש רק להובלה בין-לאומית ומרכז הפצה רק להפצה מקומית"], correct:2,
 explain:"בסיווג סוגי המתקנים בחומר, \"מרכז הפצה\" מוגדר כמבצע פעולות משלימות (איחוד, אריזה, ואף \"יצור\" קל) בנוסף לאחסון, בעוד \"מחסן\" משמש לאחסון בלבד - זהו ההבדל התפקודי המרכזי בין השניים."},
{topic:"t1", q:"מהו העיקרון שבבסיס \"שטעון\" (Cross-docking) כפעולה במרכז הפצה?",
 options:["אחסון ממושך של סחורה במרכז לפני הפצתה", "העברת סחורה ממקורות שונים ישירות ליעדיה תוך מזעור זמן האחסון בביניים","איחוד מספר משלוחים קטנים לצורך אחסון ארוך טווח","פעולה המבוצעת אך ורק בנמלים"], correct:1,
 explain:"שטעון (Cross-docking) הוא תהליך שבו סחורה עוברת ממקורות שונים ישירות ליעדיה עם זמן שהייה מינימלי במתקן הביניים - למעשה מיון ומעבר מהיר, לא אחסון."},
{topic:"t1", q:"מדוע נחשב \"עומס תנועה\" לאתגר שמחריף עם התפתחות שרשראות אספקה גלובליות?",
 options:["מפני שגלובליזציה מקטינה תמיד את מספר כלי הרכב בכבישים","עומס קשור אך ורק לתחבורת נוסעים ואינו מושפע משרשרת האספקה","עומס נפתר מעצמו ככל שגדל מספר מרכזי ההפצה","הרחבת ההתמחות וההפצה הגלובלית מגדילה את נפח התנועה הנדרש בין צמתים על גבי תשתית קיימת בעלת קיבולת מוגבלת"], correct:3,
 explain:"עומס הוצג כאחד מ\"אתגרי\" התחום לצד מלאים ומרכזי הפצה. ככל שגדלה הפעילות הכלכלית והגלובלית, גדל נפח התנועה הנדרש דרך תשתיות קיימות בעלות קיבולת קבועה - ומכאן החרפת העומס."},
{topic:"t1", q:"מה ההבדל בין \"נמל\" ל\"אזור סחר חופשי\" מבחינת תפקידם במערך התובלה?",
 options:["נמל משמש רק להובלה יבשתית ואזור סחר חופשי רק להובלה ימית","נמל הוא ממשק פיזי בין ים ליבשה, בעוד אזור סחר חופשי הוא מתחם בעל משטר מכס/מס מיוחד המשמש גם לאחסון זמני של סחורות","שני המונחים מתארים בדיוק את אותו סוג המתקן","אזור סחר חופשי משמש אך ורק ליצוא"], correct:1,
 explain:"בסיווג מתקני ההובלה, נמל הוא מתקן פיזי לממשק ים-יבשה, בעוד אזור סחר חופשי הוא מתקן בעל מעמד מיוחד מבחינת מיסוי ומכס, המשמש בין היתר לאחסון ולעיבוד סחורות זמנית בטרם המשך דרכן."},
{topic:"t1", q:"מדוע נחשבים מוקדי שילוח של מכבי אש, משטרה ואמבולנס לדוגמה טיפוסית לבעיית \"מיקום מתקנים\" ולא לבעיית \"ניתוב\"?",
 options:["מפני שרכבי חירום אינם נעים כלל ברשת הדרכים","מפני שהשאלה המרכזית היא היכן למקם את בסיסי השירות כדי למזער את זמן ההגעה ליעדי חירום, ולא כיצד לתכנן מסלול נסיעה בודד","מפני שאין להם כל מגבלת זמן הגעה","מפני שמדובר תמיד בבעיית זרימה מקסימלית"], correct:1,
 explain:"בעיית מיקום מתקנים עוסקת בהחלטת המיקום עצמו (איפה למקם בסיס), בעוד בעיית ניתוב עוסקת בתכנון מסלול נתון. עבור שירותי חירום השאלה המרכזית היא היכן למקם את הבסיסים כך שזמני התגובה יהיו מינימליים - זו בדיוק בעיית מיקום מתקנים."},
{topic:"t1", q:"במה שונה \"מסוף Intermodal\" מ\"מסוף צובר\"?",
 options:["מסוף Intermodal מיועד להעברת יחידות מטען סטנדרטיות (כגון מכולות) בין אמצעי תובלה, בעוד מסוף צובר מיועד לחומרים בכמות גדולה שאינם ארוזים (כגון דגנים או נוזלים)","מסוף Intermodal משמש רק לנוסעים ומסוף צובר רק למטענים","שני המונחים מתארים אותו סוג מתקן","מסוף צובר משמש רק לתחבורה אווירית"], correct:0,

{topic:"t1", q:"מדוע ההבחנה בין \"תכנון תחבורה\" ל\"הנדסת תעבורה\" חשובה, אף שהם קשורים זה לזה?",
 options:["שני התחומים זהים לחלוטין","הנדסת תעבורה עוסקת בהיבטים ארוכי טווח ותכנון תחבורה בתפעול היומיומי","הנדסת תעבורה עוסקת בעיצוב ובתפעול יומיומי של זרימת התנועה, בעוד תכנון תחבורה מתמקד בהיבטים ארוכי טווח כמו פיתוח רשתות ותחזיות ביקוש","הנדסת תעבורה רלוונטית רק לתחבורה ימית"], correct:2,
 explain:"בין תחומי התחבורה המוזכרים בחומר מופיעים הן הנדסת תעבורה והן תכנון תחבורה. הראשונה מתמקדת בתפעול היומיומי (זרימה, קיבולת, איתות), בעוד השנייה עוסקת בהיבטים ארוכי הטווח - פיתוח רשתות, תחזיות ביקוש ומדיניות."},
{topic:"t1", q:"מדוע \"כלכלת תחבורה\" נחשבת תחום נפרד מ\"תכנון עירוני ואזורי\", למרות חפיפה חלקית ביניהם?",
 options:["אין קשר כלל בין שני התחומים","כלכלת תחבורה בוחנת עלויות ותמחור והקצאת משאבים במערכת התחבורה, בעוד תכנון עירוני ואזורי עוסק בשילוב מערכת התחבורה במרקם המרחבי-חברתי הרחב","כלכלת תחבורה עוסקת רק בתחבורה ציבורית","תכנון עירוני ואזורי אינו מתייחס כלל לתשתיות תחבורה"], correct:1,

{topic:"t1", q:"מדוע \"מרכז לוגיסטי משולב\" (כגון פארק תעשייתי/\"עיר לוגיסטית\") נחשב לרמה גבוהה יותר של אינטגרציה בהשוואה למרכז הפצה בודד?",
