 {term:"בעיית ניתוב רכבים (VRP)", def:"שיבוץ רכבים (אחד או יותר) למשימות/לקוחות בהינתן אילוצים (קיבולת, זמן, מיקום) במטרה להקטין עלויות/זמנים/מרחקים כוללים; קשה יותר חישובית מ-TSP בשל ריבוי המימדים."},
 {term:"חלון זמן (Time Window)", def:"אילוץ בבעיית VRP המגדיר טווח זמן להגעה ללקוח; יכול להיות קשיח (ללא חריגה) או גמיש (סטייה מותרת, לרוב בקנס)."},
 {term:"E-VRP", def:"הרחבה של בעיית ניתוב הרכבים עבור כלי רכב חשמליים, המחייבת התייחסות למגבלת טווח הסוללה ולמיקום תחנות הטעינה לאורך המסלול."},
 {term:"Dial-a-Ride", def:"שילוב של ניתוב דינמי וחלונות זמן, המשמש בבעיות איסוף והסעת נוסעים לפי בקשה."},

 {term:"אלגוריתם חמדני (Greedy Algorithm)", def:"אלגוריתם העובד בצעדים, כשבכל צעד הוא בוחר את הפעולה הנותנת את מירב התועלת המיידית, ללא התחשבות בהשלכות עתידיות; אינו תמיד מגיע לפתרון האופטימלי אך לרוב קרוב אליו."},
 {term:"Brute Force (כוח גס)", def:"שיטת פתרון נאיבית המפיקה את כל האפשרויות האפשריות, מחשבת את העלות של כל אחת ובוחרת בטובה ביותר; מבטיחה אופטימליות אך בלתי מעשית כשמרחב האפשרויות גדול (למשל TSP)."},
 {term:"התפוצצות קומבינטורית", def:"תופעה שבה הוספת איבר בודד (למשל לקוח נוסף ב-TSP) מגדילה את מרחב הפתרונות האפשריים בקצב פקטוריאלי (n!) ולא ליניארי, מה שהופך בעיות מסוימות לבלתי פתירות באופן מעשי."},
 {term:"דרגת קודקוד (Degree)", def:"מספר הקשתות המחוברות לקודקוד נתון בגרף; משמשת לקביעת קיום מסלולי ומעגלי אוילר."},
 {term:"מסלול אוילר", def:"מסלול בגרף העובר בכל קשת בדיוק פעם אחת; קיים בגרף קשיר רק אם יש בו בדיוק 0 או 2 קודקודים בעלי דרגה אי-זוגית."},
 {term:"מעגל אוילר", def:"מסלול אוילר סגור החוזר לנקודת ההתחלה; קיים רק כאשר כל קודקודי הגרף בדרגה זוגית."},
 {term:"בעיית גשרי קניגסברג", def:"בעיה היסטורית ששאלה האם ניתן לעבור בכל 7 גשרי העיר קניגסברג פעם אחת ולחזור לנקודת המוצא; אוילר הוכיח שהדבר בלתי אפשרי, וכך נולדה תורת הגרפים."},
 {term:"GIS (מערכת מידע גיאוגרפית)", def:"מערכת ממוחשבת לאיסוף, אחסון, ניתוח והצגה של מידע גיאוגרפי, המשלבת נתונים, חומרה, תוכנה, פרוצדורות וכוח אדם."},
 {term:"פורמט ראסטר", def:"שיטת אחסון נתונים גיאוגרפיים המבוססת על חלוקה לתאים (פיקסלים); מתאימה לתצלומי אוויר וסריקות אך ברזולוציה קבועה."},
 {term:"פורמט וקטורי", def:"שיטת אחסון נתונים גיאוגרפיים המבוססת על קואורדינטות מתמטיות (X,Y), המאפשרת חישובים ועריכה דינמית; מיוצג בנקודות, קווים ופוליגונים."},
 {term:"גיאורפרנסינג (עיגון תמונה)", def:"תהליך התאמת תצלום אוויר/לוויין למערכת הקואורדינטות של המפה, באמצעות סיבוב, הגדלה והתאמת קנה מידה."},
 {term:"Overlay (חפיפת שכבות)", def:"שיטת ניתוח ב-GIS שבה נתונים נשמרים בשכבות נושאיות נפרדות, המאפשרת שאילתות המשלבות תנאים ממספר שכבות בו-זמנית."},
 {term:"Linear Referencing (מיקום ליניארי)", def:"שיטה למיקום נקודות תפעוליות (תאונות, תקלות) לאורך קו (כביש) לפי מרחק מנקודת ייחוס, במקום קואורדינטות מוחלטות."},

 {term:"טריאנגולציה", def:"שיטת חישוב מיקום נקודה במרחב על ידי הצלבת מרחקים ממספר מקורות ידועים (לוויינים, נקודות Wi-Fi); נדרשים 3 לוויינים למיקום דו-ממדי ו-4 לגובה."},
 {term:"A-GPS (Assisted GPS)", def:"שיטה המאיצה את זיהוי המיקום בטלפונים סלולריים על ידי הורדת נתוני מיקומי הלוויינים משרת אינטרנט מתעדכן במקום ישירות מהלוויין."},

 {term:"Indoor Positioning (מיקום בתוך מבנים)", def:"טכנולוגיות חלופיות ל-GPS (אשר אינו יעיל בתוך מבנים) הכוללות Wi-Fi, Bluetooth וחיישני סמארטפון (מצפן, ג'ירוסקופ, מד תאוצה)."},
 {term:"שילוח דינמי (Dynamic Dispatch)", def:"שיבוץ משימה לרכב הפנוי והקרוב ביותר בזמן אמת, המבוסס על נתוני מיקום עדכניים של כלל כלי הרכב בצי."},
];

/* הענקת מזהה רץ לכל שאלה */
QUESTIONS.forEach((q,i)=>{ q.id = i+1; });

/* ================= כלים ================= */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function sample(arr, n){
  return shuffle(arr).slice(0, Math.min(n, arr.length));
}
/* מכינה עותק "רץ" של שאלה: מערבבת את סדר המסיחים ומעדכנת את אינדקס התשובה הנכונה */
function prepQuestion(q){
  const order = shuffle([0,1,2,3]);
  const options = order.map(idx=>q.options[idx]);
  const correct = order.indexOf(q.correct);
  return {id:q.id, topic:q.topic, q:q.q, options, correct, explain:q.explain};
}

const app = document.getElementById('app');
const printArea = document.getElementById('printArea');

let session = null; // {mode, items:[{...prepped, chosen:null}], idx, timerSec, timerHandle, startTs}

function el(html){ const d=document.createElement('div'); d.innerHTML=html; return d.firstElementChild; }

/* ================= מסך הבית ================= */
function goHome(){
  clearTimer();
  session = null;
  render();
}

function countByTopic(key){ return QUESTIONS.filter(q=>q.topic===key).length; }

function render(){
  printArea.style.display = 'none';
  document.body.classList.remove('printing');
  if(!session){ renderHome(); return; }
  if(session.mode==='print'){ renderPrintConfig(); return; }
  if(session.mode==='glossary'){ renderGlossary(); return; }
  if(session.finished){ renderResult(); return; }
  renderQuiz();
}

/* ================= תרגול לפי נושא ================= */
function startPractice(topicKey){
  const pool = topicKey==='ALL' ? QUESTIONS.slice() : QUESTIONS.filter(q=>q.topic===topicKey);
  const items = shuffle(pool).map(q=>({...prepQuestion(q), chosen:null, answered:false}));
  session = {mode:'practice', topicKey, items, idx:0, finished:false, showFeedback:true, startCount:items.length};
  render();
}

/* ================= מבחנים ================= */
function startExam(n, seconds, label){
  const pool = sample(QUESTIONS, n);
  const items = pool.map(q=>({...prepQuestion(q), chosen:null, answered:false}));
  session = {mode:'exam', label, items, idx:0, finished:false, showFeedback:false, timerSec:seconds, totalSec:seconds};
  startTimer();
  render();
}

function startTimer(){
  clearTimer();
  session.timerHandle = setInterval(()=>{
    if(!session) return;
    session.timerSec--;
    updateTimerDisplay();
    if(session.timerSec<=0){
      clearTimer();
      finishSession();
    }
  }, 1000);
}
function clearTimer(){
  if(session && session.timerHandle){ clearInterval(session.timerHandle); session.timerHandle=null; }
}
function fmtTime(s){
  s = Math.max(0,s);
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
}
function updateTimerDisplay(){
  const elm = document.getElementById('timerBox');
  if(!elm) return;
  elm.textContent = '⏱ '+fmtTime(session.timerSec);
  elm.classList.toggle('low', session.timerSec<=60);
}

/* ================= תצוגת שאלון (תרגול/מבחן) ================= */
function renderQuiz(){
  const it = session.items[session.idx];
  const total = session.items.length;
  const pct = Math.round(((session.idx)/total)*100);

  const optsHtml = it.options.map((opt,i)=>{
    let cls = 'opt';
    if(it.answered){
      cls += ' disabled';
      if(i===it.correct) cls += ' correct';
      else if(i===it.chosen) cls += ' wrong';
    } else if(it.chosen===i){
      cls += ' selected';
    }
    const letters = ['א','ב','ג','ד'];
    return `<div class="${cls}" onclick="selectOption(${i})">
      <span class="let">${letters[i]}</span>
      <span>${opt}</span>
    </div>`;
  }).join('');

  const isLast = session.idx === total-1;
  const canGoNext = session.mode==='exam' ? true : it.answered;

  let explainHtml = '';
  if(session.mode==='practice' && it.answered){
    const letters = ['א','ב','ג','ד'];
    const wasRight = it.chosen===it.correct;
    explainHtml = `<div class="explain-box">
      ${!wasRight ? `<span class="fix">התשובה הנכונה: ${letters[it.correct]}. ${it.options[it.correct]}</span>` : ''}
      <b>הסבר:</b> ${it.explain || ''}
    </div>`;
  }

  app.innerHTML = `
    <div class="back-row"><button class="btn" onclick="confirmExit()">→ חזרה לתפריט</button></div>
    <div class="quiz-shell">
      <div class="quiz-head">
        <div class="prog">שאלה ${session.idx+1} מתוך ${total} ${session.mode==='practice' ? '· '+TOPIC_TITLE[session.topicKey] : '· '+session.label}</div>
        ${session.mode==='exam' ? `<div class="timer" id="timerBox">⏱ ${fmtTime(session.timerSec)}</div>` : ''}
      </div>
      <div class="progressbar"><div style="width:${pct}%"></div></div>
      <div class="qbody">
        <div class="qtopic">${TOPIC_TITLE[it.topic]}</div>
        <p class="qtext">${it.q}</p>
        <div class="opts">${optsHtml}</div>
        ${explainHtml}
      </div>
      <div class="qfoot">
        <div style="font-size:12px;color:var(--muted)">${session.mode==='practice' ? (it.answered ? (it.chosen===it.correct? '✔ נכון!' : '✘ לא נכון') : 'בחר/י תשובה') : ''}</div>
        <button class="btn primary" ${canGoNext?'':'disabled'} onclick="nextQuestion()">${isLast ? (session.mode==='exam' ? 'סיום מבחן' : 'סיום תרגול') : 'הבא ←'}</button>
      </div>
    </div>
  `;
  if(session.mode==='exam') updateTimerDisplay();
}

function selectOption(i){
  const it = session.items[session.idx];
  if(session.mode==='practice'){
    if(it.answered) return;
    it.chosen = i;
    it.answered = true;
  } else {
    // מבחן: ניתן לשנות תשובה עד למעבר לשאלה הבאה, ללא חשיפת נכון/שגוי
    it.chosen = i;
    it.answered = true;
  }
  renderQuiz();
}

function nextQuestion(){
  if(session.idx < session.items.length-1){
    session.idx++;
    render();
  } else {
    finishSession();
  }
}

function confirmExit(){
  if(confirm('לצאת מהתרגול/מבחן הנוכחי? ההתקדמות לא תישמר.')){
    clearTimer();
    goHome();
  }
}

function finishSession(){
  clearTimer();
  session.finished = true;
  render();
}

/* ================= תוצאות וסקירה ================= */
function renderResult(){
  const items = session.items;
  const total = items.length;
  const correctCount = items.filter(it=>it.chosen===it.correct).length;
  const pct = total ? Math.round((correctCount/total)*100) : 0;

  const reviewHtml = items.map((it,i)=>{
    const wasRight = it.chosen===it.correct;
    const letters = ['א','ב','ג','ד'];
    const chosenTxt = it.chosen!=null ? letters[it.chosen]+'. '+it.options[it.chosen] : 'לא נענה';
    return `<div class="review-item">
      <div class="tag">${TOPIC_TITLE[it.topic]}</div>
      <div class="qi">${i+1}. ${it.q}</div>
      <div class="rowline ${wasRight?'rc':'rw'}">תשובתך: ${chosenTxt}</div>
      ${!wasRight ? `<div class="rowline rc">התשובה הנכונה: ${letters[it.correct]}. ${it.options[it.correct]}</div>` : ''}
      <div class="rowline explainr"><b>הסבר:</b> ${it.explain || ''}</div>
    </div>`;
  }).join('');

  const title = session.mode==='practice' ? 'סיכום תרגול: '+TOPIC_TITLE[session.topicKey] : 'סיכום '+session.label;

  app.innerHTML = `
    <div class="quiz-shell">
      <div class="result-wrap">
        <div class="score-ring" style="--pct:${pct}"><div class="num">${pct}%</div><div class="lbl">ציון</div></div>
        <h2>${title}</h2>
        <p>ענית נכון על ${correctCount} מתוך ${total} שאלות.</p>
        <div class="result-actions">
          <button class="btn primary" onclick="retrySame()">🔁 נסה שוב (מעורבב מחדש)</button>
          <button class="btn ghost" style="color:var(--ink);background:#fff" onclick="goHome()">🏠 תפריט ראשי</button>
        </div>
      </div>
      <div style="padding:0 22px 24px">
        <div class="section-title" style="margin-top:0"><span class="dot"></span>סקירת תשובות</div>
        ${reviewHtml}
      </div>
    </div>
  `;
}

function retrySame(){
  if(session.mode==='practice'){
    startPractice(session.topicKey);
  } else {
    const n = session.items.length;
    const seconds = session.totalSec;
    const label = session.label;
    startExam(n, seconds, label);
  }
}

/* ================= הדפסה ================= */
let printSelection = new Set(TOPICS.map(t=>t.key));

function openPrintConfig(){
  session = {mode:'print'};
  render();
}

function renderPrintConfig(){
  const checks = TOPICS.map(t=>`
    <label>
      <input type="checkbox" value="${t.key}" ${printSelection.has(t.key)?'checked':''} onchange="togglePrintTopic('${t.key}', this.checked)">
      ${t.title} (${countByTopic(t.key)})
    </label>
  `).join('');

  app.innerHTML = `
    <div class="back-row"><button class="btn" onclick="goHome()">→ חזרה לתפריט</button></div>
    <div class="print-panel">
      <h3 style="margin-top:0">בחירת נושאים להדפסה</h3>
      <div style="display:flex;gap:8px;margin-bottom:10px;">
        <button class="btn" onclick="selectAllPrint(true)">בחר הכל</button>
        <button class="btn" onclick="selectAllPrint(false)">נקה בחירה</button>
      </div>
      <div class="topic-checks">${checks}</div>
      <button class="btn primary" onclick="doPrint()" style="margin-top:8px">🖨️ הדפס עכשיו</button>
    </div>
  `;
}

function togglePrintTopic(key, checked){
  if(checked) printSelection.add(key); else printSelection.delete(key);
}
function selectAllPrint(all){
  printSelection = new Set(all ? TOPICS.map(t=>t.key) : []);
  renderPrintConfig();
}

function doPrint(){
  if(printSelection.size===0){ alert('נא לבחור לפחות נושא אחד להדפסה.'); return; }
  const chosenTopics = TOPICS.filter(t=>printSelection.has(t.key));
  let html = `<div class="p-head">מאגר שאלות – ניהול מערכות תובלה ושינוע</div>
              <div class="p-sub">התשובה הנכונה מודגשת ומסומנת בקו תחתון. סה"כ ${chosenTopics.reduce((s,t)=>s+countByTopic(t.key),0)} שאלות.</div>`;
  chosenTopics.forEach(t=>{
    html += `<div class="p-topic-title">${t.title}</div>`;
    const qs = QUESTIONS.filter(q=>q.topic===t.key);
    qs.forEach((q,i)=>{
      const lis = q.options.map((op,oi)=>`<li class="${oi===q.correct?'correctA':''}">${op}</li>`).join('');
      html += `<div class="p-q"><div class="p-qt">${i+1}. ${q.q}</div><ol type="a">${lis}</ol></div>`;
    });
  });
  printArea.innerHTML = html;
  printArea.style.display = 'block';
  setTimeout(()=>{ window.print(); }, 80);
}

/* ================= מילון מושגים ================= */
function openGlossary(){
  clearTimer();
  session = {mode:'glossary'};
  render();
}

function renderGlossary(filter){
  filter = (filter||'').trim().toLowerCase();
  const list = GLOSSARY.filter(g => !filter || g.term.toLowerCase().includes(filter) || g.def.toLowerCase().includes(filter));
  const itemsHtml = list.length ? list.map(g=>`
    <div class="gloss-item">
      <div class="gterm">${g.term}</div>
      <div class="gdef">${g.def}</div>
    </div>
  `).join('') : `<div class="gloss-empty">לא נמצאו מושגים התואמים את החיפוש.</div>`;

  app.innerHTML = `
    <div class="back-row"><button class="btn" onclick="goHome()">→ חזרה לתפריט</button></div>
    <div class="hero" style="padding:20px 22px;">
      <h2 style="font-size:19px;">📖 מילון מושגים כללי</h2>
      <p>${GLOSSARY.length} מושגי יסוד מכל נושאי הקורס - מבוא, זרימה ברשתות, מיקום מתקנים וניתוב רכבים.</p>
    </div>
    <input class="glossary-search" id="glossSearch" placeholder="חיפוש מושג..." value="${filter}" oninput="renderGlossary(this.value)">
    <div id="glossList">${itemsHtml}</div>
  `;
  const inp = document.getElementById('glossSearch');
  if(inp){ inp.focus(); inp.selectionStart = inp.selectionEnd = inp.value.length; }
}

/* ================= אתחול ================= */
render();
</script>
